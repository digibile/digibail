name: Privileged read-only filesystem attribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-disk-privileged.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect host disk through read-only root mount
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 11m
          script: |
            set -eu
            docker run --rm --privileged --pid=host -v /:/host:ro alpine:3.20 sh -c '
              set -u
              echo "=== Root filesystem accounting ==="
              df -hT /host
              du -xhd1 /host 2>/dev/null | sort -h | tail -35
              echo "=== Containerd and Docker storage ==="
              for p in /host/var/lib/containerd /host/var/lib/docker /host/opt/containerd; do
                if [ -e "$p" ]; then
                  echo "--- $p"
                  du -xhd3 "$p" 2>/dev/null | sort -h | tail -45 || true
                fi
              done
              echo "=== Other large root directories ==="
              for p in /host/home /host/opt /host/var /host/usr /host/root; do
                if [ -d "$p" ]; then echo "--- $p"; du -xhd1 "$p" 2>/dev/null | sort -h | tail -25 || true; fi
              done
              echo "=== Large files over 500MB ==="
              find /host -xdev -type f -size +500M -printf "%s bytes %p\n" 2>/dev/null | sort -nr | head -100 || true
              echo "=== Largest logs ==="
              find /host/var/log -xdev -type f -printf "%s %p\n" 2>/dev/null | sort -nr | head -40 || true
              echo "=== End root filesystem accounting ==="
              df -hT /host
              echo "PRIVILEGED_READ_ONLY_DISK_ATTRIBUTION=1"
            '
