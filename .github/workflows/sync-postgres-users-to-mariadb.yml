name: Sync PostgreSQL registrations to MariaDB

on:
  workflow_run:
    workflows: ["Deploy digebail.ir production site"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    if: "\${{ github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, 'sync PostgreSQL registrations to MariaDB') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Back up MariaDB and mirror newly registered identities
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: \${{ secrets.DEPLOY_HOST }}
          username: \${{ secrets.DEPLOY_USER }}
          key: \${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; elif docker info >/dev/null 2>&1; then D="docker"; else echo "DOCKER_ACCESS=UNAVAILABLE"; exit 20; fi
            APP_ID="$($D compose ps -q app 2>/dev/null || true)"
            [ -n "$APP_ID" ] || { echo "APP_CONTAINER_NOT_RUNNING"; exit 21; }
            DB_NAME="$(sed -n 's/^MARIADB_DATABASE=//p' .env | tail -1)"
            DB_USER="$(sed -n 's/^MARIADB_USER=//p' .env | tail -1)"
            DB_PASS="$(sed -n 's/^MARIADB_PASSWORD=//p' .env | tail -1)"
            [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASS" ] || { echo "MARIADB_ENV_INCOMPLETE"; exit 22; }
            DUMP_BIN="$(command -v mariadb-dump || command -v mysqldump || true)"
            [ -n "$DUMP_BIN" ] || { echo "MARIADB_DUMP_TOOL_UNAVAILABLE"; exit 23; }
            mkdir -p "$ROOT/.migration-backups"
            chmod 700 "$ROOT/.migration-backups"
            BACKUP="$ROOT/.migration-backups/mariadb-before-new-identity-sync-$(date +%Y%m%d%H%M%S).sql.gz"
            if sudo -n true >/dev/null 2>&1; then
              sudo -n env MYSQL_PWD="$DB_PASS" "$DUMP_BIN" --protocol=SOCKET --socket=/var/lib/mysql/mysql.sock --user="$DB_USER" --single-transaction --quick --skip-lock-tables "$DB_NAME" | gzip > "$BACKUP"
            else
              MYSQL_PWD="$DB_PASS" "$DUMP_BIN" --protocol=SOCKET --socket=/var/lib/mysql/mysql.sock --user="$DB_USER" --single-transaction --quick --skip-lock-tables "$DB_NAME" | gzip > "$BACKUP"
            fi
            chmod 600 "$BACKUP"
            test -s "$BACKUP"
            echo "MARIADB_BACKUP_CREATED=1"
            $D compose exec -T app node /app/scripts/sync-postgres-users-to-mariadb.mjs
            curl -fsS http://127.0.0.1:1631/healthz >/dev/null
            echo "MARIADB_IDENTITY_SYNC_AND_BACKUP=PASS"
