name: Identify actual VamCity production login container and database

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/identify-vamcity-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Identify old app and database mapping without changing data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            if sudo -n docker info >/dev/null 2>&1; then D='sudo -n docker'; else D='docker'; fi
            echo "=== ALL CONTAINERS ==="
            $D ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            for APP in public_html-web-1 vamcity-stage-app; do
              if $D inspect "$APP" >/dev/null 2>&1; then
                echo "=== APP=$APP ==="
                $D inspect "$APP" --format 'IMAGE={{.Config.Image}} WORKDIR={{.Config.WorkingDir}} ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}} MOUNTS={{json .Mounts}}'
                echo "ENV_NAMES:"
                $D inspect "$APP" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | sort -u | head -n 100
                echo "SAFE_DB_CONNECTION_TARGET:"
                $D inspect "$APP" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^ConnectionStrings__DefaultConnection=' | sed 's/^[^=]*=//' | sed -nE 's/.*(Server|Data Source)=([^;]*).*/DB_SERVER=\2/Ip; s/.*(Initial Catalog|Database)=([^;]*).*/DB_NAME=\2/Ip'
                echo "RECENT_LOGS:"
                ($D logs --tail 50 "$APP" 2>&1 || true) | sed -E 's/((PASSWORD|PASS|TOKEN|SECRET|KEY|CONNECTIONSTRING)[^= :]*[=:])[[:space:]]*[^[:space:]]+/\1[REDACTED]/Ig' | tail -n 35
              fi
            done
            for SQLC in public_html-db-1 vamcity-stage-sql; do
              if $D inspect "$SQLC" >/dev/null 2>&1; then
                echo "=== SQL=$SQLC DATABASES ==="
                SQLCMD="$($D exec "$SQLC" sh -lc 'command -v /opt/mssql-tools18/bin/sqlcmd || command -v /opt/mssql-tools/bin/sqlcmd || command -v sqlcmd' 2>/dev/null | head -n 1)"
                SA_PASS="$($D exec "$SQLC" printenv MSSQL_SA_PASSWORD 2>/dev/null || true)"
                if [ -n "$SQLCMD" ] && [ -n "$SA_PASS" ]; then
                  $D exec "$SQLC" "$SQLCMD" -S localhost -U sa -P "$SA_PASS" -C -W -s '|' -Q "SET NOCOUNT ON; SELECT name,state_desc FROM sys.databases ORDER BY name;" 2>&1 | tail -n 40
                  echo "=== RESTORE HISTORY (database names and timestamps only) ==="
                  $D exec "$SQLC" "$SQLCMD" -S localhost -U sa -P "$SA_PASS" -C -W -s '|' -Q "SET NOCOUNT ON; SELECT TOP 30 rh.destination_database_name, rh.restore_date, bs.database_name AS backup_source_database, bs.backup_finish_date, bs.type AS backup_type FROM msdb.dbo.restorehistory rh LEFT JOIN msdb.dbo.backupset bs ON bs.backup_set_id=rh.backup_set_id ORDER BY rh.restore_date DESC;" 2>&1 | tail -n 35
                  if [ "$SQLC" = "vamcity-stage-sql" ]; then
                    for DBNAME in vamcityc_vamcity vamcityc_bluvamdb vamcityc_transferDb; do
                      echo "=== TABLE ROW COUNTS: $DBNAME ==="
                      $D exec "$SQLC" "$SQLCMD" -S localhost -U sa -P "$SA_PASS" -C -W -s '|' -d "$DBNAME" -Q "SET NOCOUNT ON; SELECT s.name+'.'+t.name AS table_name, SUM(p.rows) AS row_count FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id JOIN sys.partitions p ON p.object_id=t.object_id AND p.index_id IN (0,1) GROUP BY s.name,t.name ORDER BY s.name,t.name;" 2>&1 | tail -n 120
                    done
                  fi
                else echo "SQL_ACCESS_UNAVAILABLE"; fi
                unset SA_PASS
              fi
            done
            echo "=== SOURCE ZIP CHECKSUMS AND BACKUP FILE IDENTIFICATION ==="
            ROOT="/home/digibail/domains/digebail.ir"
            for f in "$ROOT"/vamcityc_bluvamdb_2026-10-29_19-19-45.zip "$ROOT"/vamcityc_transferDb_2026-10-29_19-19-51.zip "$ROOT"/vamcityc_vamcity_2026-10-29_19-20-04.zip; do
              if [ -f "$f" ]; then
                sha256sum "$f"
                unzip -Z1 "$f" | head -n 5
                inner="$(unzip -Z1 "$f" | head -n 1)"
                unzip -p "$f" "$inner" | head -c 16 | od -An -tx1
              else echo "MISSING_BACKUP=$f"; fi
            done
            echo "=== SOURCE TABLE COLUMN DEFINITIONS (no customer values) ==="
            if $D inspect "vamcity-stage-sql" >/dev/null 2>&1; then
              SQLC="vamcity-stage-sql"
              SQLCMD="$($D exec "$SQLC" sh -lc 'command -v /opt/mssql-tools18/bin/sqlcmd || command -v /opt/mssql-tools/bin/sqlcmd || command -v sqlcmd' 2>/dev/null | head -n 1)"
              SA_PASS="$($D exec "$SQLC" printenv MSSQL_SA_PASSWORD 2>/dev/null || true)"
              if [ -n "$SQLCMD" ] && [ -n "$SA_PASS" ]; then
                for DBNAME in vamcityc_vamcity_import_20261028 vamcityc_bluvamdb_import_20261028 vamcityc_transferDb_import_20261028; do
                  echo "=== CORE_COLUMNS_DATABASE=$DBNAME ==="
                  $D exec "$SQLC" "$SQLCMD" -S localhost -U sa -P "$SA_PASS" -C -h -1 -W -s '|' -d "$DBNAME" -Q "SET NOCOUNT ON; SELECT t.name,c.name,TYPE_NAME(c.user_type_id),c.is_nullable FROM sys.tables t JOIN sys.columns c ON c.object_id=t.object_id WHERE t.name IN ('AspNetUsers','Customers','SmsPatterns') ORDER BY t.name,c.column_id;" 2>&1 | tail -n 180
                done
              fi
              unset SA_PASS
            fi
            echo "=== SERVER APP SETTINGS PATHS ==="
            find /home/roofixo/domains/roofixo.ir/vamcity-app/releases -maxdepth 3 -type f \( -iname 'appsettings*.json' -o -iname '*.config' \) -printf '%p\n' 2>/dev/null | head -n 60
            echo "PRODUCTION_MAPPING_INSPECTION_COMPLETE=1"
