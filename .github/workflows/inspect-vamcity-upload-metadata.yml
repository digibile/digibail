name: Inspect stale upload metadata with root read-only container

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-vamcity-upload-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Read file metadata and host open handles without modifying uploads
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            if sudo -n docker info >/dev/null 2>&1; then D='sudo -n docker'; else D='docker'; fi
            IMAGE="$($D inspect vamcity-stage-sql --format '{{.Config.Image}}')"
            $D run --rm --user 0:0 --pid=host --entrypoint /bin/sh -v /:/host:ro -v /proc:/hostproc:ro "$IMAGE" -c '
              for f in /host/home/tmp/upload.*; do
                [ -f "$f" ] || continue
                echo "=== $(basename "$f") ==="
                stat -c "SIZE=%s MTIME=%y OWNER=%u:%g MODE=%a INODE=%i" "$f"
                printf "MAGIC="; od -An -tx1 -N16 "$f" | tr -s " "
                inode=$(stat -c %i "$f")
                found=0
                for fd in /hostproc/[0-9]*/fd/*; do
                  target=$(readlink "$fd" 2>/dev/null || true)
                  if [ "$target" = "$f" ]; then echo "OPEN_HANDLE=$fd"; found=1; fi
                done
                [ "$found" = 1 ] || echo "OPEN_HANDLE=NONE_FOUND"
              done
            '
            echo "UPLOAD_METADATA_INSPECTION_COMPLETE=1"
