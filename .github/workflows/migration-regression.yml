name: DigiBail migration regression

on:
  push:
    branches:
      - migration/php83-full-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run route and storefront regression tests
        run: npm test
