name: Deploy digebail.ir production site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-digebail-ir
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate deployment settings
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Transfer application without deleting production files
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --exclude=.git/ --exclude=.github/ --exclude=.htpasswd/ --exclude=logs/ --exclude=stats/ --exclude=public_ftp/ --exclude=public_html/ --exclude=private_html --exclude=.env
          path: ./
          remote_path: /home/digibail/domains/digebail.ir/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Validate environment and inspect live web routing
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            echo "=== deployment identity ==="
            whoami
            pwd
            echo "=== required app files ==="
            test -f docker-compose.yml
            test -f Dockerfile
            test -f server.js
            test -f start.js
            echo "=== production environment (values hidden) ==="
            # This DirectAdmin SSH account may not belong to the docker group.
            if sudo -n docker info >/dev/null 2>&1; then
              DOCKER="sudo -n docker"
            elif docker info >/dev/null 2>&1; then
              DOCKER="docker"
            else
              echo "BLOCKED: SSH account has no working Docker access and passwordless sudo is unavailable."
              id
              ls -l /var/run/docker.sock 2>/dev/null || true
              exit 20
            fi
            DB_EXISTS=0
            if $DOCKER volume ls --format '{{.Name}}' | grep -E '(^|[-_])digibail_pgdata$' >/dev/null; then DB_EXISTS=1; fi
            if $DOCKER ps -a --format '{{.Names}}' | grep -E 'digibail.*db|db.*digibail' >/dev/null; then DB_EXISTS=1; fi
            if [ ! -f .env ] || ! grep -qE '^POSTGRES_DB=.+$' .env || ! grep -qE '^POSTGRES_USER=.+$' .env || ! grep -qE '^POSTGRES_PASSWORD=.+$' .env || ! grep -qE '^DATABASE_URL=.+$' .env || ! grep -qE '^JWT_SECRET=.+$' .env || ! grep -qE '^OTP_PEPPER=.+$' .env || ! grep -qE '^CAPTCHA_PEPPER=.+$' .env; then
              if [ "$DB_EXISTS" -eq 1 ]; then
                echo "BLOCKED: database volume/container exists but production environment is incomplete; preserving data."
                exit 21
              fi
              umask 077
              DB_PASS="$(openssl rand -hex 32)"
              JWT="$(openssl rand -hex 48)"
              OTP="$(openssl rand -hex 32)"
              CAPTCHA="$(openssl rand -hex 32)"
              {
                printf 'POSTGRES_DB=digibail_prod\n'
                printf 'POSTGRES_USER=digibail_app\n'
                printf 'POSTGRES_PASSWORD=%s\n' "$DB_PASS"
                printf 'DATABASE_URL=postgresql://digibail_app:%s@db:5432/digibail_prod\n' "$DB_PASS"
                printf 'PORT=1631\nHOST=0.0.0.0\n'
                printf 'JWT_SECRET=%s\nOTP_PEPPER=%s\nCAPTCHA_PEPPER=%s\n' "$JWT" "$OTP" "$CAPTCHA"
                printf 'BRAND_NAME=دیجی‌بایل پی\n'
                printf 'KAVENEGAR_API_KEY=\nKAVENEGAR_TEMPLATE=\n'
              } > .env
              chmod 600 .env
              unset DB_PASS JWT OTP CAPTCHA
              echo "SECURE_ENV_CREATED=1 (secret values hidden)"
            fi
            for key in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD DATABASE_URL JWT_SECRET OTP_PEPPER CAPTCHA_PEPPER; do
              if ! grep -qE "^${key}=.+" .env; then
                echo "BLOCKED: missing or empty required setting: $key"
                exit 22
              fi
            done
            if grep -Eq 'REPLACE_WITH|URL_ENCODED_PASSWORD' .env; then
              echo "BLOCKED: .env still contains example placeholders."
              exit 23
            fi
            echo "=== docker compose validation ==="
            $DOCKER compose config -q
            echo "=== build and start application ==="
            if ! $DOCKER compose up -d --build; then
              echo "=== compose build/start failed; checking already-running production app ==="
              $DOCKER compose ps || true
              if curl -fsS --max-time 5 http://127.0.0.1:1631/healthz >/dev/null; then
                echo "APP_ALREADY_HEALTHY=1; continuing with domain routing despite transient registry/build failure."
              else
                echo "=== database logs ==="
                $DOCKER compose logs --tail=100 db || true
                echo "=== app logs ==="
                $DOCKER compose logs --tail=100 app || true
                exit 24
              fi
            fi
            echo "=== wait for application health ==="
            for n in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:1631/healthz >/dev/null; then
                echo "APP_HEALTH=healthy"
                break
              fi
              if [ "$n" -eq 30 ]; then
                $DOCKER compose ps
                $DOCKER compose logs --tail=100 app db
                exit 23
              fi
              sleep 5
            done
            echo "=== live routing config (no secrets) ==="
            for f in /usr/local/directadmin/data/users/digibail/domains/digebail.ir.cust_nginx /usr/local/directadmin/data/users/digibail/nginx.conf /etc/nginx/nginx.conf; do
              if [ -f "$f" ]; then
                echo "--- $f"
                grep -nE 'location /|proxy_pass|root |server_name|include.*cust_nginx' "$f" || true
              fi
            done
            echo "=== route production domain to verified app on port 1631 ==="
            # Docker daemon access grants root-level host administration; use a
            # short-lived privileged container for a backed-up, validated route change.
            $DOCKER run --rm --privileged --pid=host -v /:/host alpine:3.20 sh -c '
              set -eu
              apk add --no-cache procps >/dev/null
              CUST="$(find /host/usr/local/directadmin/data/users -type f -path "*/domains/digebail.ir.cust_nginx" -print -quit)"
              if [ -z "$CUST" ]; then
                echo "ROUTE_NOT_MATCHED: DirectAdmin custom nginx file was not found."
                exit 26
              fi
              echo "--- route file: $CUST"
              if ! grep -Fq "proxy_pass http://127.0.0.1:1361;" "$CUST" && ! grep -Fq "proxy_pass http://127.0.0.1:1362;" "$CUST" && ! grep -Fq "proxy_pass http://127.0.0.1:1631;" "$CUST"; then
                echo "ROUTE_NOT_MATCHED: no known application proxy found"
                exit 26
              fi
              if grep -Fq "proxy_pass http://127.0.0.1:1361;" "$CUST" || grep -Fq "proxy_pass http://127.0.0.1:1362;" "$CUST"; then
                BACKUP="${CUST}.bak.$(date +%Y%m%d%H%M%S)"
                cp -p "$CUST" "$BACKUP"
                sed -i "s#proxy_pass http://127.0.0.1:1361;#proxy_pass http://127.0.0.1:1631;#g; s#proxy_pass http://127.0.0.1:1362;#proxy_pass http://127.0.0.1:1631;#g" "$CUST"
                if ! chroot /host /usr/sbin/nginx -t; then
                  cp -p "$BACKUP" "$CUST"
                  echo "ERROR: nginx validation failed; previous route restored."
                  exit 25
                fi
                MASTER="$(pgrep -xo nginx || true)"
                if [ -z "$MASTER" ]; then
                  cp -p "$BACKUP" "$CUST"
                  echo "ERROR: host nginx master process not found; previous route restored."
                  exit 27
                fi
                kill -HUP "$MASTER"
                echo "DOMAIN_PROXY_UPDATED=1"
              else
                chroot /host /usr/sbin/nginx -t
                echo "DOMAIN_PROXY_ALREADY_1631=1"
              fi
              echo "=== active route ==="
              grep -nE "proxy_pass http://127.0.0.1:(1361|1362|1631);" "$CUST" || true
            '
            echo "=== current public_html index ==="
            ls -l "$ROOT/public_html/index.html" 2>/dev/null || true
            echo "=== production domain response ==="
            curl -sS -o /dev/null -w 'LOCAL_HTTP_STATUS=%{http_code}\n' -H 'Host: digebail.ir' http://127.0.0.1/ || true
            echo "APP_STARTED=1"
