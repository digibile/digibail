name: Inspect Digibail PostgreSQL safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-digibail-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only PostgreSQL and deployment diagnostics
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; elif docker info >/dev/null 2>&1; then D="docker"; else echo "DOCKER_UNAVAILABLE"; exit 40; fi
            echo "=== ENV KEYS ONLY ==="
            if [ -f .env ]; then
              grep -E '^(POSTGRES_DB|POSTGRES_USER|DATABASE_URL|APP_VERSION|DEPLOY_COMMIT_SHA)=' .env | sed -E 's/^(DATABASE_URL)=.*/\1=<redacted>/; s/^(POSTGRES_PASSWORD)=.*/\1=<redacted>/'
            else echo "ENV_FILE_MISSING"; fi
            echo "=== COMPOSE STATUS ==="
            $D compose ps || true
            echo "=== POSTGRES CONTAINER ENV (NO PASSWORDS) ==="
            CID="$($D compose ps -q db | head -n 1)"
            if [ -n "$CID" ]; then
              $D inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$CID" | grep -E '^(POSTGRES_DB|POSTGRES_USER)=' || true
              echo "=== TRY DEFAULT POSTGRES SUPERUSER READ ONLY ==="
              $D exec "$CID" sh -lc 'psql -U postgres -d postgres -Atc "SELECT rolname,rolsuper,rolcanlogin FROM pg_roles ORDER BY rolname;"' || echo "POSTGRES_ROLE_INSPECTION_FAILED"
              echo "=== TRY APPLICATION URL ROLE READ ONLY ==="
              $D exec "$CID" sh -lc 'psql -U platform -d negara_fadak -Atc "SELECT rolname,rolsuper,rolcanlogin FROM pg_roles ORDER BY rolname;"' || echo "APPLICATION_ROLE_LOGIN_FAILED"
              echo "=== TRY CONFIGURED ROLE READ ONLY ==="
              $D exec "$CID" sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT current_user,current_database();"' || echo "CONFIGURED_ROLE_LOGIN_FAILED"
              echo "=== DATABASE LIST READ ONLY ==="
              $D exec "$CID" sh -lc 'psql -U postgres -d postgres -Atc "SELECT datname FROM pg_database WHERE datallowconn ORDER BY datname;"' || true
            else echo "POSTGRES_CONTAINER_NOT_FOUND"; fi
            echo "=== APP DATABASE URL IDENTITY ONLY ==="
            AID="$($D compose ps -q app | head -n 1)"
            if [ -n "$AID" ]; then
              $D exec "$AID" node -e 'try{const u=new URL(process.env.DATABASE_URL);console.log("DATABASE_URL_USER="+decodeURIComponent(u.username));console.log("DATABASE_URL_DB="+u.pathname.slice(1));}catch(e){console.log("DATABASE_URL_PARSE_FAILED")}' || true
            else echo "APP_CONTAINER_NOT_FOUND"; fi
            echo "POSTGRES_DIAGNOSTICS_READ_ONLY=1"
