name: Stop cross-project VamCity backfills in Digibail

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-stop-vamcity-backfills.yml"

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop only verified VamCity backfill one-off containers
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; elif docker info >/dev/null 2>&1; then D="docker"; else echo "BLOCKED: Docker unavailable"; exit 20; fi
            for name in digebailir-app-run-cd1f86a567cb digebailir-app-run-e94c8292b3d7; do
              id="$($D ps -aq --filter "name=^/$name$")"
              if [ -z "$id" ]; then
                echo "CONTAINER_ALREADY_ABSENT=$name"
                continue
              fi
              args="$($D inspect --format '{{json .Args}}' "$id")"
              echo "VERIFY_CONTAINER=$name args=$args"
              if ! printf '%s' "$args" | grep -Fq '/app/scripts/backfill-legacy-customers.mjs'; then
                echo "BLOCKED: refusing to stop a container that is not the verified VamCity backfill."
                exit 21
              fi
              if $D inspect --format '{{.State.Running}}' "$id" | grep -qx true; then
                $D stop --time 15 "$id"
                echo "VAMCITY_BACKFILL_STOPPED=$name"
              else
                echo "CONTAINER_ALREADY_STOPPED=$name"
              fi
            done
            echo "=== verify no matching VamCity backfill process remains running ==="
            if $D ps --format '{{.Names}} {{.Command}}' | grep -E 'digebailir-app-run-(cd1f86a567cb|e94c8292b3d7)' ; then
              echo "ERROR: a verified backfill container is still running."
              exit 22
            fi
            echo "VAMCITY_BACKFILL_PROCESSES_RUNNING=0"
            echo "=== verify Digibail database lock queue ==="
            $D compose exec -T db sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT pid,state,wait_event_type,wait_event,pg_blocking_pids(pid) AS blockers,now()-query_start AS duration,left(query,180) AS query FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() ORDER BY query_start NULLS LAST"'
