name: Validate DigiBail PHP 8.3

on:
  pull_request:
    branches:
      - migration/php83-full-rebuild
    paths:
      - 'php/**'
      - '.github/workflows/validate-php83.yml'

permissions:
  contents: read

jobs:
  php-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, openssl, pdo, pdo_mysql, fileinfo
          coverage: none
          tools: composer:v2
      - name: Validate dependencies and run tests
        working-directory: php
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
          composer test
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
