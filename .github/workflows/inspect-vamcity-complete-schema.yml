name: Export complete VamCity SQL Server schema inventory

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-vamcity-complete-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract schema metadata from isolated imported backups
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            if sudo -n docker info >/dev/null 2>&1; then D='sudo -n docker'; elif docker info >/dev/null 2>&1; then D='docker'; else echo "DOCKER_UNAVAILABLE"; exit 40; fi
            SQLC="vamcity-stage-sql"
            SQLCMD="$($D exec "$SQLC" sh -lc 'command -v /opt/mssql-tools18/bin/sqlcmd || command -v /opt/mssql-tools/bin/sqlcmd || command -v sqlcmd' 2>/dev/null | head -n 1)"
            PASS="$($D exec "$SQLC" printenv MSSQL_SA_PASSWORD 2>/dev/null || true)"
            [ -n "$PASS" ] || PASS="$($D exec "$SQLC" printenv SA_PASSWORD 2>/dev/null || true)"
            [ -n "$SQLCMD" ] && [ -n "$PASS" ] || { echo "SQL_ACCESS_UNAVAILABLE"; exit 41; }
            TMP="$(mktemp -d /tmp/vamcity-schema.XXXXXX)"
            chmod 700 "$TMP"
            trap 'rm -rf "$TMP"; unset PASS' EXIT
            dump_query() {
              DB="$1"; LABEL="$2"; QUERY="$3"
              echo "=== $LABEL DATABASE=$DB ==="
              $D exec -e SQLCMDPASSWORD="$PASS" "$SQLC" "$SQLCMD" -S localhost -U sa -C -b -h -1 -s '|' -w 65535 -d "$DB" -Q "SET NOCOUNT ON; $QUERY" 2>&1
            }
            for DB in vamcityc_vamcity_import_20261028 vamcityc_bluvamdb_import_20261028 vamcityc_transferDb_import_20261028; do
              $D exec -e SQLCMDPASSWORD="$PASS" "$SQLC" "$SQLCMD" -S localhost -U sa -C -b -h -1 -W -s '|' -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE name=N'$DB' AND state_desc='ONLINE';" | grep -Fx "$DB" >/dev/null || { echo "DATABASE_MISSING=$DB"; exit 42; }
              dump_query "$DB" "TABLES_AND_ROW_COUNTS" "SELECT s.name,t.name,COALESCE(SUM(CASE WHEN p.index_id IN (0,1) THEN p.rows ELSE 0 END),0) FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id LEFT JOIN sys.partitions p ON p.object_id=t.object_id GROUP BY s.name,t.name ORDER BY s.name,t.name;"
              dump_query "$DB" "ALL_COLUMNS" "SELECT s.name,t.name,c.column_id,c.name,ty.name,CASE WHEN ty.name IN ('nvarchar','nchar') AND c.max_length<>-1 THEN c.max_length/2 WHEN ty.name IN ('varchar','char','varbinary','binary') THEN c.max_length ELSE c.max_length END,c.precision,c.scale,c.is_nullable,c.is_identity,c.is_computed,dc.definition,cc.definition FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id JOIN sys.columns c ON c.object_id=t.object_id JOIN sys.types ty ON ty.user_type_id=c.user_type_id LEFT JOIN sys.default_constraints dc ON dc.object_id=c.default_object_id LEFT JOIN sys.computed_columns cc ON cc.object_id=c.object_id AND cc.column_id=c.column_id ORDER BY s.name,t.name,c.column_id;"
              dump_query "$DB" "PRIMARY_AND_UNIQUE_KEYS" "SELECT s.name,t.name,kc.name,kc.type_desc,c.name,ic.key_ordinal FROM sys.key_constraints kc JOIN sys.tables t ON t.object_id=kc.parent_object_id JOIN sys.schemas s ON s.schema_id=t.schema_id JOIN sys.index_columns ic ON ic.object_id=t.object_id AND ic.index_id=kc.unique_index_id JOIN sys.columns c ON c.object_id=t.object_id AND c.column_id=ic.column_id ORDER BY s.name,t.name,kc.name,ic.key_ordinal;"
              dump_query "$DB" "FOREIGN_KEYS" "SELECT ps.name,pt.name,fk.name,pc.name,rs.name,rt.name,rc.name,fkc.constraint_column_id,fk.delete_referential_action_desc,fk.update_referential_action_desc,fk.is_disabled,fk.is_not_trusted FROM sys.foreign_keys fk JOIN sys.foreign_key_columns fkc ON fkc.constraint_object_id=fk.object_id JOIN sys.tables pt ON pt.object_id=fk.parent_object_id JOIN sys.schemas ps ON ps.schema_id=pt.schema_id JOIN sys.columns pc ON pc.object_id=pt.object_id AND pc.column_id=fkc.parent_column_id JOIN sys.tables rt ON rt.object_id=fk.referenced_object_id JOIN sys.schemas rs ON rs.schema_id=rt.schema_id JOIN sys.columns rc ON rc.object_id=rt.object_id AND rc.column_id=fkc.referenced_column_id ORDER BY ps.name,pt.name,fk.name,fkc.constraint_column_id;"
              dump_query "$DB" "INDEXES" "SELECT s.name,t.name,i.name,i.type_desc,i.is_unique,i.is_primary_key,i.is_unique_constraint,i.is_disabled,i.has_filter,i.filter_definition,ic.key_ordinal,ic.is_included_column,c.name FROM sys.indexes i JOIN sys.tables t ON t.object_id=i.object_id JOIN sys.schemas s ON s.schema_id=t.schema_id JOIN sys.index_columns ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id JOIN sys.columns c ON c.object_id=t.object_id AND c.column_id=ic.column_id WHERE i.index_id>0 ORDER BY s.name,t.name,i.name,ic.key_ordinal,ic.index_column_id;"
              dump_query "$DB" "CHECK_CONSTRAINTS" "SELECT s.name,t.name,cc.name,cc.definition,cc.is_disabled,cc.is_not_trusted FROM sys.check_constraints cc JOIN sys.tables t ON t.object_id=cc.parent_object_id JOIN sys.schemas s ON s.schema_id=t.schema_id ORDER BY s.name,t.name,cc.name;"
              dump_query "$DB" "VIEWS_ROUTINES_TRIGGERS" "SELECT s.name,o.name,o.type,o.type_desc,OBJECTPROPERTYEX(o.object_id,'IsEncrypted'),CASE WHEN sm.definition IS NULL THEN 0 ELSE LEN(sm.definition) END FROM sys.objects o JOIN sys.schemas s ON s.schema_id=o.schema_id LEFT JOIN sys.sql_modules sm ON sm.object_id=o.object_id WHERE o.type IN ('V','P','FN','IF','TF','TR') ORDER BY s.name,o.type,o.name;"
              dump_query "$DB" "SEQUENCES_AND_USER_TYPES" "SELECT 'SEQUENCE',SCHEMA_NAME(schema_id),name,TYPE_NAME(user_type_id),start_value,increment,minimum_value,maximum_value,is_cycling FROM sys.sequences UNION ALL SELECT 'USER_TYPE',SCHEMA_NAME(schema_id),name,TYPE_NAME(system_type_id),NULL,NULL,NULL,NULL,NULL FROM sys.types WHERE is_user_defined=1 ORDER BY 1,2,3;"
              dump_query "$DB" "DATABASE_TRIGGERS" "SELECT name,type_desc,is_disabled,OBJECT_DEFINITION(object_id) FROM sys.triggers WHERE parent_class=0 ORDER BY name;"
              echo "=== END_DATABASE=$DB ==="
            done
            echo "VAMCITY_COMPLETE_SCHEMA_INVENTORY_EXTRACTED=1"
