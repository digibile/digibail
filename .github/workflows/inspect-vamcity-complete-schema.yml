name: Diagnose legacy SQL Server administrator access

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-vamcity-complete-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect SQL Server admin access without exposing credentials
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -eu
            if sudo -n docker info >/dev/null 2>&1; then D='sudo -n docker'; else D='docker'; fi
            SQLC="public_html-db-1"
            echo "SQL_CONTAINER_PRESENT=$($D inspect "$SQLC" >/dev/null 2>&1 && echo 1 || echo 0)"
            echo "SQLCMD_PATH=$($D exec "$SQLC" sh -lc 'command -v /opt/mssql-tools18/bin/sqlcmd || command -v /opt/mssql-tools/bin/sqlcmd || command -v sqlcmd' 2>/dev/null | head -1)"
            echo "SQL_ENV_KEY_NAMES_BEGIN"
            $D exec "$SQLC" sh -lc 'env | cut -d= -f1 | grep -Ei "PASS|SQL|MSSQL|CONNECTION|USER" | sort -u' 2>/dev/null || true
            echo "SQL_ENV_KEY_NAMES_END"
            for KEY in MSSQL_SA_PASSWORD SA_PASSWORD; do
              V="$($D exec "$SQLC" printenv "$KEY" 2>/dev/null || true)"
              echo "${KEY}_PRESENT=$([ -n "$V" ] && echo 1 || echo 0)"
              unset V
            done
            echo "COMPOSE_LABELS_BEGIN"
            $D inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}|{{ index .Config.Labels "com.docker.compose.project.config_files" }}|{{ index .Config.Labels "com.docker.compose.project" }}' "$SQLC"
            echo "COMPOSE_LABELS_END"
            echo "=== VERIFY DATABASE CATALOG THROUGH APPLICATION LOGIN ==="
            WEB="public_html-web-1"
            SQLCMD="$($D exec "$SQLC" sh -lc 'command -v /opt/mssql-tools18/bin/sqlcmd || command -v /opt/mssql-tools/bin/sqlcmd || command -v sqlcmd' 2>/dev/null | head -1)"
            CONN="$($D inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$WEB" | sed -n 's/^ConnectionStrings__DefaultConnection=//p' | head -1)"
            CREDS="$(CONN="$CONN" node -e 'const s=process.env.CONN;const o={};for(const p of s.split(";")){const i=p.indexOf("=");if(i>0)o[p.slice(0,i).trim().toLowerCase()]=p.slice(i+1).trim()}const pick=(...k)=>k.map(x=>o[x]).find(Boolean)||"";console.log(pick("initial catalog","database"));console.log(pick("user id","uid","user"));console.log(pick("password","pwd"));')"
            DEFAULT_DB="$(printf '%s\n' "$CREDS" | sed -n '1p')"
            USER="$(printf '%s\n' "$CREDS" | sed -n '2p')"
            PASS="$(printf '%s\n' "$CREDS" | sed -n '3p')"
            $D exec -e SQLCMDPASSWORD="$PASS" "$SQLC" "$SQLCMD" -S localhost -U "$USER" -C -b -h -1 -W -s '|' -d "$DEFAULT_DB" -Q "SET NOCOUNT ON; SELECT name,state_desc FROM sys.databases ORDER BY name;"
            unset PASS CONN CREDS
            echo "SQL_ADMIN_ACCESS_DIAGNOSTIC_COMPLETED=1"
