name: Inspect DigiBail MariaDB schema safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-digibail-mariadb-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read matching app DB credentials privately and export schema only
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -eu
            DB='digibail_vamcitydigibilepay'
            echo "=== SSH ACCOUNT ==="
            id
            python3 - <<'PY'
            from pathlib import Path
            from urllib.parse import urlparse, unquote
            import os, base64
            home = Path.home()
            files = [
                home / "domains/digebail.ir/php_app/.env",
                home / "domains/digebail.ir/.env",
            ]
            target = "digibail_vamcitydigibilepay"
            chosen = None
            for path in files:
                if not path.is_file() or not os.access(path, os.R_OK):
                    continue
                d = {}
                for raw in path.read_text(errors="ignore").splitlines():
                    line = raw.strip()
                    if not line or line.startswith("#") or "=" not in line:
                        continue
                    k, v = line.split("=", 1)
                    d[k.strip()] = v.strip().strip('"').strip("'")
                url = d.get("DATABASE_URL") or d.get("MYSQL_URL")
                if url:
                    try:
                        u = urlparse(url)
                        d.setdefault("DB_HOST", u.hostname or "localhost")
                        d.setdefault("DB_PORT", str(u.port or 3306))
                        d.setdefault("DB_DATABASE", u.path.lstrip("/"))
                        d.setdefault("DB_USERNAME", unquote(u.username or ""))
                        d.setdefault("DB_PASSWORD", unquote(u.password or ""))
                    except Exception:
                        pass
                db = next((d.get(k, "") for k in ("MARIADB_DATABASE","MYSQL_DATABASE","DB_DATABASE","DB_NAME") if d.get(k)), "")
                print("CONFIG_FILE=" + path.name + " CONFIGURED_DATABASE=" + db)
                if db == target:
                    chosen = (path.name, d)
                    break
            if not chosen:
                raise SystemExit("NO_CONFIG_FILE_MATCHES_TARGET_DATABASE")
            name, d = chosen
            def pick(*keys):
                for k in keys:
                    if d.get(k):
                        return d[k]
                return ""
            user = pick("MARIADB_USER","MYSQL_USER","DB_USERNAME","DB_USER","DATABASE_USER")
            password = pick("MARIADB_PASSWORD","MYSQL_PASSWORD","DB_PASSWORD","DB_PASS","DATABASE_PASSWORD")
            if not password and d.get("DB_PASSWORD_B64"):
                try: password = base64.b64decode(d["DB_PASSWORD_B64"]).decode()
                except Exception: pass
            host = pick("MARIADB_HOST","MYSQL_HOST","DB_HOST","DATABASE_HOST") or "localhost"
            port = pick("MARIADB_PORT","MYSQL_PORT","DB_PORT","DATABASE_PORT") or "3306"
            print("MATCHING_CONFIG=" + name)
            print("DB_USER_FOUND=" + str(bool(user)))
            print("DB_PASSWORD_FOUND=" + str(bool(password)))
            print("DB_HOST=" + host)
            if not user or not password:
                raise SystemExit("MATCHED_CONFIG_HAS_NO_DB_CREDENTIALS")
            cnf = Path("/tmp/digibail-mysql-inspect.cnf")
            cnf.write_text("[client]\nuser=" + user.replace("\n","") + "\npassword=" + password.replace("\n","") + "\nhost=" + host + "\nport=" + port + "\n")
            cnf.chmod(0o600)
            PY
            MYSQL_CNF='/tmp/digibail-mysql-inspect.cnf'
            echo "=== MYSQL AUTH TEST ==="
            mysql --defaults-extra-file="$MYSQL_CNF" -NBe "SELECT USER(), CURRENT_USER(), VERSION()"
            echo "=== TARGET DATABASE EXISTS ==="
            EXISTS="$(mysql --defaults-extra-file="$MYSQL_CNF" -NBe "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='$DB'")"
            if [ "$EXISTS" != "$DB" ]; then
              echo "DATABASE_NOT_FOUND=$DB"
              exit 32
            fi
            echo "DATABASE_FOUND=$DB"
            echo "=== TABLE INVENTORY ==="
            mysql --defaults-extra-file="$MYSQL_CNF" -NBe "SELECT TABLE_NAME, TABLE_TYPE, COALESCE(ENGINE,''), COALESCE(TABLE_ROWS,0) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$DB' ORDER BY TABLE_NAME"
            echo "=== COLUMN INVENTORY ==="
            mysql --defaults-extra-file="$MYSQL_CNF" -NBe "SELECT TABLE_NAME, ORDINAL_POSITION, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, COALESCE(COLUMN_DEFAULT,''), EXTRA FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='$DB' ORDER BY TABLE_NAME, ORDINAL_POSITION"
            echo "=== INDEX INVENTORY ==="
            mysql --defaults-extra-file="$MYSQL_CNF" -NBe "SELECT TABLE_NAME, INDEX_NAME, NON_UNIQUE, SEQ_IN_INDEX, COLUMN_NAME, INDEX_TYPE FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='$DB' ORDER BY TABLE_NAME, INDEX_NAME, SEQ_IN_INDEX"
            echo "=== FOREIGN KEY INVENTORY ==="
            mysql --defaults-extra-file="$MYSQL_CNF" -NBe "SELECT TABLE_NAME, COLUMN_NAME, CONSTRAINT_NAME, REFERENCED_TABLE_NAME, REFERENCED_COLUMN_NAME FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='$DB' AND REFERENCED_TABLE_NAME IS NOT NULL ORDER BY TABLE_NAME, CONSTRAINT_NAME, ORDINAL_POSITION"
            echo "=== SCHEMA SQL DUMP (NO DATA) ==="
            mysqldump --defaults-extra-file="$MYSQL_CNF" --no-data --skip-comments --compact --no-tablespaces --routines --triggers --events "$DB"
            rm -f "$MYSQL_CNF"
            echo "SCHEMA_ONLY_EXPORT_COMPLETE=1"
