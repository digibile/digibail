name: Inspect DigiBail MariaDB schema safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-digibail-mariadb-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate authorized MySQL credentials without printing secrets
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -eu
            DB='digibail_vamcitydigibilepay'
            echo "=== SSH ACCOUNT ==="
            id
            echo "HOME=$HOME"
            echo "=== DIRECTADMIN MYSQL CONFIG FILES (PATHS AND PERMISSIONS ONLY) ==="
            for f in /usr/local/directadmin/conf/mysql.conf /usr/local/directadmin/data/users/digibail/mysql.conf /home/digibail/.my.cnf /root/.my.cnf /etc/mysql/debian.cnf; do
              if [ -e "$f" ]; then ls -l "$f"; else echo "MISSING=$f"; fi
            done
            echo "=== POSSIBLE DATABASE CONFIG FILE PATHS (NO CONTENTS) ==="
            find /home/digibail -maxdepth 6 -type f \( -name '.my.cnf' -o -name '.env' -o -name 'database.php' -o -name 'config.php' -o -name 'wp-config.php' -o -name 'settings.php' \) -printf '%m %u %p\n' 2>/dev/null | head -100
            echo "=== DIRECTADMIN USER FILES (NAMES ONLY) ==="
            find /usr/local/directadmin/data/users/digibail -maxdepth 2 -type f -printf '%m %u %p\n' 2>/dev/null | grep -Ei 'mysql|database|user' | head -100 || true

            MYSQL=''
            DUMP=''
            for cnf in /usr/local/directadmin/conf/mysql.conf /usr/local/directadmin/data/users/digibail/mysql.conf /home/digibail/.my.cnf /root/.my.cnf /etc/mysql/debian.cnf; do
              if [ -r "$cnf" ] && mysql --defaults-extra-file="$cnf" --protocol=socket -NBe "SELECT 1" >/dev/null 2>&1; then
                MYSQL="mysql --defaults-extra-file=$cnf --protocol=socket"
                DUMP="mysqldump --defaults-extra-file=$cnf --protocol=socket"
                echo "MYSQL_AUTH_SOURCE=$cnf"
                break
              fi
            done
            if [ -z "$MYSQL" ] && command -v sudo >/dev/null 2>&1 && sudo -n mysql --protocol=socket -NBe "SELECT 1" >/dev/null 2>&1; then
              MYSQL='sudo -n mysql --protocol=socket'
              DUMP='sudo -n mysqldump --protocol=socket'
              echo "MYSQL_AUTH_SOURCE=sudo_socket"
            fi
            if [ -z "$MYSQL" ]; then
              echo "MYSQL_PRIVILEGED_AUTH_NOT_FOUND"
              exit 31
            fi
            echo "=== DATABASE EXISTS ==="
            EXISTS="$($MYSQL -NBe "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='$DB'")"
            if [ "$EXISTS" != "$DB" ]; then
              echo "DATABASE_NOT_FOUND=$DB"
              $MYSQL -NBe "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA ORDER BY SCHEMA_NAME"
              exit 32
            fi
            echo "DATABASE_FOUND=$DB"
            echo "=== TABLE INVENTORY ==="
            $MYSQL -NBe "SELECT TABLE_NAME, TABLE_TYPE, COALESCE(ENGINE,''), COALESCE(TABLE_ROWS,0) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$DB' ORDER BY TABLE_NAME"
            echo "=== COLUMN INVENTORY ==="
            $MYSQL -NBe "SELECT TABLE_NAME, ORDINAL_POSITION, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, COALESCE(COLUMN_DEFAULT,''), EXTRA FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='$DB' ORDER BY TABLE_NAME, ORDINAL_POSITION"
            echo "=== INDEX INVENTORY ==="
            $MYSQL -NBe "SELECT TABLE_NAME, INDEX_NAME, NON_UNIQUE, SEQ_IN_INDEX, COLUMN_NAME, INDEX_TYPE FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='$DB' ORDER BY TABLE_NAME, INDEX_NAME, SEQ_IN_INDEX"
            echo "=== FOREIGN KEY INVENTORY ==="
            $MYSQL -NBe "SELECT TABLE_NAME, COLUMN_NAME, CONSTRAINT_NAME, REFERENCED_TABLE_NAME, REFERENCED_COLUMN_NAME FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='$DB' AND REFERENCED_TABLE_NAME IS NOT NULL ORDER BY TABLE_NAME, CONSTRAINT_NAME, ORDINAL_POSITION"
            echo "=== SCHEMA SQL DUMP (NO DATA) ==="
            $DUMP --no-data --skip-comments --compact --no-tablespaces --routines --triggers --events "$DB"
            echo "SCHEMA_ONLY_EXPORT_COMPLETE=1"
