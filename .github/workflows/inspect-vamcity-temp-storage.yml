name: Inspect large temporary storage before VamCity import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-vamcity-temp-storage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Read-only breakdown of large temp directories and SQL Server volume
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            echo "=== /home/tmp SUBDIRECTORY SIZES ==="
            du -xhd1 /home/tmp 2>/dev/null | sort -h | tail -n 40 || true
            echo "=== /home/tmp LARGE FILES ==="
            find /home/tmp -xdev -type f -size +100M -printf '%s bytes | %TY-%Tm-%Td %TH:%TM | %u:%g | %p\n' 2>/dev/null | sort -nr | head -n 40 || true
            echo "=== /home/tmp TOP LEVEL OWNERS AND DATES ==="
            find /home/tmp -mindepth 1 -maxdepth 1 -printf '%TY-%Tm-%Td %TH:%TM | %u:%g | %y | %p\n' 2>/dev/null | head -n 80 || true
            echo "=== SQL SERVER VOLUME SIZE ==="
            du -sh /var/lib/docker/volumes/vamcity_stage_sql_data/_data 2>/dev/null || true
            echo "=== DATABASE STORAGE SUMMARY ==="
            mysql --batch --skip-column-names -e "SELECT table_schema,ROUND(SUM(data_length+index_length)/1024/1024,1) AS MB FROM information_schema.tables GROUP BY table_schema ORDER BY SUM(data_length+index_length) DESC LIMIT 15;" 2>/dev/null || true
            echo "TEMP_STORAGE_INSPECTION_COMPLETE=1"
