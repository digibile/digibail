name: Import VamCity records into the main Digibail database

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-vamcity-real-data.yml
      - scripts/import-legacy-loan-products.mjs
      - scripts/backfill-legacy-customers.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-vamcity-real-data
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for deployed importer and execute migration on the server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 80m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D='sudo -n docker'; elif docker info >/dev/null 2>&1; then D='docker'; else echo "BLOCKED: Docker unavailable"; exit 20; fi
            FOUND=0
            for n in $(seq 1 90); do
              if [ -s "$ROOT/scripts/backfill-legacy-customers.mjs" ] && grep -q "BUSINESS_CUSTOMERS_BACKFILL_ROWS" "$ROOT/scripts/backfill-legacy-customers.mjs" && [ -s "$ROOT/scripts/import-vamcity-real-data.mjs" ] && grep -q "sensitive command details suppressed" "$ROOT/scripts/import-vamcity-real-data.mjs" && grep -q "Isolate the heavy migration process from the live web container" "$ROOT/scripts/import-vamcity-real-data.mjs" && grep -q "diagnostic details filtered" "$ROOT/scripts/import-vamcity-real-data.mjs" && grep -q "error?.stdout" "$ROOT/scripts/import-vamcity-real-data.mjs" && grep -q "error?.message" "$ROOT/scripts/import-vamcity-real-data.mjs" && grep -q "stdout_bytes" "$ROOT/scripts/import-vamcity-real-data.mjs" && grep -q "offset += 500" "$ROOT/scripts/import-vamcity-real-data.mjs" && [ -s "$ROOT/scripts/migrate-legacy-digibail.js" ]; then FOUND=1; break; fi
              sleep 5
            done
            [ "$FOUND" -eq 1 ] || { echo "BLOCKED: importer files not deployed"; exit 21; }
            echo "=== Wait for production deploy to finish before starting database writes ==="
            STABLE=0
            PREV=""
            for n in $(seq 1 60); do
              CURRENT="$($D compose ps -q app 2>/dev/null || true)"
              if [ -n "$CURRENT" ] && [ "$CURRENT" = "$PREV" ] && curl -fsS http://127.0.0.1:1631/healthz >/dev/null 2>&1; then STABLE=$((STABLE+1)); else STABLE=0; fi
              PREV="$CURRENT"
              if [ "$STABLE" -ge 3 ]; then break; fi
              sleep 10
            done
            [ "$STABLE" -ge 3 ] || { echo "BLOCKED: app container did not stabilize after deploy within 10 minutes"; exit 22; }
            echo "=== Importing all verified source database tables into PostgreSQL using isolated worker containers ==="
            node "$ROOT/scripts/import-vamcity-real-data.mjs"
            echo "=== Backfill the full customer directory into local PostgreSQL ==="
            $D compose exec -T app node /app/scripts/backfill-legacy-customers.mjs
            echo "=== Convert recognized legacy loan definitions into the structured admin workspace ==="
            RECOVERY_PASSWORD="$($D run --rm -v /:/host alpine:3.20 sh -c "sed -n 's/^password=//p' /host/root/digibail-admin-recovery.txt | head -n 1")"
            printf '%s\n' "$RECOVERY_PASSWORD" | $D compose exec -T app sh -c 'IFS= read -r RECOVERY_PASSWORD; export RECOVERY_PASSWORD; exec node /app/scripts/import-legacy-loan-products.mjs'
            unset RECOVERY_PASSWORD
            echo "=== Server-side migration process returned success ==="
