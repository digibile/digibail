name: Digibail read-only storage inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-storage-inventory.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only host storage inspection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 7m
          script: |
            set -u
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT" || exit 2
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; elif docker info >/dev/null 2>&1; then D="docker"; else D=""; fi
            echo "=== Filesystem and inode usage ==="
            df -hT /
            df -ih /
            echo "=== Root directory usage ==="
            du -xhd1 / 2>/dev/null | sort -h | tail -25 || true
            echo "=== Digibail home usage ==="
            du -xhd2 /home/digibail 2>/dev/null | sort -h | tail -35 || true
            echo "=== Docker root usage ==="
            if [ -n "$D" ]; then
              DROOT="$($D info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
              echo "DOCKER_ROOT=$DROOT"
              if [ -n "$DROOT" ]; then du -xhd2 "$DROOT" 2>/dev/null | sort -h | tail -35 || true; fi
              $D ps -a --size || true
              $D images --digests || true
              $D volume ls || true
            fi
            echo "=== Large files over 100 MB ==="
            find /home/digibail /var/log /root -xdev -type f -size +100M -printf '%s %p\n' 2>/dev/null | sort -nr | head -50 || true
            echo "STORAGE_INVENTORY_COMPLETE=1"
