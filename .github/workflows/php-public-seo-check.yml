name: PHP public SEO regression

on:
  push:
    branches:
      - feature/php83-public-seo-ssr-20261102
    paths:
      - 'php/**'
      - '.github/workflows/php-public-seo-check.yml'
  pull_request:
    branches:
      - migration/php83-full-rebuild

permissions:
  contents: read

jobs:
  php-public-seo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo, pdo_mysql, fileinfo
          coverage: none
          tools: composer:v2
      - name: Validate and install
        working-directory: php
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist
      - name: Run PHP regression suite
        working-directory: php
        run: composer test
      - name: Lint all PHP sources
        working-directory: php
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
