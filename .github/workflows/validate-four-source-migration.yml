name: Validate four-source MariaDB migration code

on:
  push:
    branches:
      - migration/php83-full-rebuild
    paths:
      - database/migration/migrate.php
      - .github/workflows/validate-four-source-migration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/php83-full-rebuild
          fetch-depth: 1
      - name: PHP 8.3 syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint migration importer
        run: php -l database/migration/migrate.php
