name: Deploy DigiBail PHP 8.3 (isolated)

on:
  push:
    branches:
      - migration/php83-full-rebuild
    paths:
      - 'php/**'
      - '.github/workflows/deploy-php83-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digebail-php83-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PHP migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/php83-full-rebuild
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, openssl, pdo, pdo_mysql, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate, install dependencies and test
        working-directory: php
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --no-dev --prefer-dist --optimize-autoloader
          composer test
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify deployment credentials
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Configure pinned SSH host verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          EXPECTED='SHA256:9bIljRY2O89S4QXg9v6zYuLfk39pK8nl69BOg7vP5os'
          SCAN_OK=0
          for attempt in 1 2 3 4 5; do
            echo "SSH_HOST_KEYSCAN_ATTEMPT=$attempt"
            if ssh-keyscan -T 15 -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>~/.ssh/keyscan.log \
              && test -s ~/.ssh/known_hosts; then
              SCAN_OK=1
              break
            fi
            cat ~/.ssh/keyscan.log || true
            sleep 5
          done
          if [ "$SCAN_OK" -ne 1 ]; then
            echo "::error::Unable to retrieve SSH host key after 5 attempts. Deployment stopped."
            exit 1
          fi
          ACTUAL="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | sort -u)"
          echo "SSH_HOST_FINGERPRINTS=$ACTUAL"
          if ! printf '%s\n' "$ACTUAL" | grep -Fxq "$EXPECTED"; then
            echo "::error::SSH host fingerprint mismatch. Deployment stopped."
            exit 1
          fi
          echo 'SSH_HOST_KEY_VERIFICATION=SUCCESS'

      - name: Deploy private PHP application and public entry point
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DOMAIN_ROOT='/home/digibail/domains/digebail.ir'
          PRIVATE_APP="$DOMAIN_ROOT/php_app"
          PUBLIC_ROOT="$DOMAIN_ROOT/public_html"
          DEPLOY_ID="$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_ID"
          BACKUP_ROOT="$DOMAIN_ROOT/.deploy-backups/php83-$DEPLOY_ID"

          # Validate the exact DirectAdmin domain and prepare a private rollback area.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             test \"\$(realpath '$DOMAIN_ROOT')\" = '$DOMAIN_ROOT'
             test -d '$PUBLIC_ROOT'
             mkdir -p '$PRIVATE_APP' '$BACKUP_ROOT/php_app' '$BACKUP_ROOT/public_html'
             chmod 755 '$PRIVATE_APP' '$PUBLIC_ROOT'
             chmod 700 '$DOMAIN_ROOT/.deploy-backups' '$BACKUP_ROOT'"

          # Back up every existing private-app file that rsync will replace.
          # The live .env and all unrelated server files are explicitly excluded.
          rsync -az --no-owner --no-group --backup --backup-dir="$BACKUP_ROOT/php_app" \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude='.env' --exclude='.git/' \
            php/ "$DEPLOY_USER@$DEPLOY_HOST:$PRIVATE_APP/"

          # Add new public assets only. Existing public files are never overwritten.
          # index.php is handled separately after preserving its current version.
          rsync -az --no-owner --no-group --ignore-existing \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude='index.php' --exclude='expert.php' --exclude='admin.php' \
            php/public/ "$DEPLOY_USER@$DEPLOY_HOST:$PUBLIC_ROOT/"

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             if [ -e '$PUBLIC_ROOT/index.php' ] || [ -L '$PUBLIC_ROOT/index.php' ]; then
               cp -a '$PUBLIC_ROOT/index.php' '$BACKUP_ROOT/public_html/index.php'
               echo 'EXISTING_INDEX_BACKED_UP=1'
             else
               echo 'EXISTING_INDEX_BACKED_UP=0'
             fi
             # Back up and retire the old public expert HTML before enabling the PHP-gated route.
             if [ -e '$PUBLIC_ROOT/expert.html' ] || [ -L '$PUBLIC_ROOT/expert.html' ]; then
               cp -a '$PUBLIC_ROOT/expert.html' '$BACKUP_ROOT/public_html/expert.html'
               rm -f '$PUBLIC_ROOT/expert.html'
               echo 'LEGACY_PUBLIC_EXPERT_HTML_RETIRED=1'
             fi
             if [ -e '$PUBLIC_ROOT/expert.php' ] || [ -L '$PUBLIC_ROOT/expert.php' ]; then
               cp -a '$PUBLIC_ROOT/expert.php' '$BACKUP_ROOT/public_html/expert.php'
             fi
             if [ -e '$PUBLIC_ROOT/admin.php' ] || [ -L '$PUBLIC_ROOT/admin.php' ]; then
               cp -a '$PUBLIC_ROOT/admin.php' '$BACKUP_ROOT/public_html/admin.php'
             fi
             # Keep the prior static landing page recoverable, but let PHP-FPM own the root route.
             if [ -e '$PUBLIC_ROOT/index.html' ] || [ -L '$PUBLIC_ROOT/index.html' ]; then
               cp -a '$PUBLIC_ROOT/index.html' '$BACKUP_ROOT/public_html/index.html'
               mv '$PUBLIC_ROOT/index.html' '$BACKUP_ROOT/public_html/index.html.disabled'
               echo 'EXISTING_STATIC_INDEX_BACKED_UP=1'
             fi
             cat > '$PUBLIC_ROOT/expert.php' <<'PHP_EXPERT'
          <?php
          declare(strict_types=1);
          require dirname(__DIR__) . '/php_app/public/expert.php';
          PHP_EXPERT
             chmod 644 '$PUBLIC_ROOT/expert.php'
             cat > '$PUBLIC_ROOT/admin.php' <<'PHP_ADMIN'
          <?php
          declare(strict_types=1);
          require dirname(__DIR__) . '/php_app/public/admin.php';
          PHP_ADMIN
             chmod 644 '$PUBLIC_ROOT/admin.php'
             cat > '$PUBLIC_ROOT/index.php' <<'PHP_ENTRY'
          <?php
          declare(strict_types=1);
          require dirname(__DIR__) . '/php_app/public/index.php';
          PHP_ENTRY
             chmod 644 '$PUBLIC_ROOT/index.php'
             test -s '$PRIVATE_APP/vendor/autoload.php'
             test -s '$PRIVATE_APP/public/home.html'
             test -s '$PRIVATE_APP/public/expert.php'
             test -s '$PRIVATE_APP/public/admin.php'
             test -s '$PRIVATE_APP/views/expert-dashboard.html'
             test -s '$PRIVATE_APP/views/admin-dashboard.html'
             test -s '$PUBLIC_ROOT/expert.php'
             test -s '$PUBLIC_ROOT/admin.php'
             php -l '$PUBLIC_ROOT/index.php'
             php -l '$PUBLIC_ROOT/expert.php'
             php -l '$PUBLIC_ROOT/admin.php'
             php -l '$PRIVATE_APP/public/index.php'
             php -l '$PRIVATE_APP/public/expert.php'
             if [ -f '$DOMAIN_ROOT/database/migration/config.php' ]; then
               /usr/local/php83/bin/php -d display_errors=1 -d display_startup_errors=1 -d log_errors=0 '$PRIVATE_APP/scripts/configure_production.php' 2>&1 || {
                 BOOTSTRAP_EXIT=\$?
                 echo "PHP_DATABASE_BOOTSTRAP_FAILED_EXIT=\$BOOTSTRAP_EXIT"
                 exit "\$BOOTSTRAP_EXIT"
               }
               chmod 600 '$PRIVATE_APP/.env'
               echo 'PHP_DATABASE_BOOTSTRAP=SUCCESS'
             else
               echo 'PHP_DATABASE_BOOTSTRAP=PENDING_CONFIG_FILE'
             fi
             /usr/local/php83/bin/php '$PRIVATE_APP/scripts/diagnose_admin_identity.php' 2897
             echo 'ADMIN_IDENTITY_DIAGNOSTICS=COMPLETED'
             echo 'PHP_FILES_TRANSFERRED=1'
             echo 'PRIVATE_APP_PATH=$PRIVATE_APP'
             echo 'PUBLIC_DOCUMENT_ROOT=$PUBLIC_ROOT'
             echo 'ROLLBACK_BACKUP=$BACKUP_ROOT'
             curl -k -sS -o /tmp/digebail-home-check.html -w 'LIVE_HOME_HTTP=%{http_code}\n' https://digebail.ir/ || true
             EXPERT_HTTP="$(curl -k -sS -o /dev/null -w '%{http_code}' https://digebail.ir/expert.php)"
             ADMIN_HTTP="$(curl -k -sS -D /tmp/digebail-admin-headers.txt -o /tmp/digebail-admin-body.txt -w '%{http_code}' https://digebail.ir/admin.php)"
             if [ "$ADMIN_HTTP" = "500" ]; then
               echo 'ADMIN_ERROR_RESPONSE_BEGIN'
               head -c 1600 /tmp/digebail-admin-body.txt 2>/dev/null || true
               echo
               echo 'ADMIN_ERROR_RESPONSE_END'
               for LOG_FILE in "$DOMAIN_ROOT/logs/error.log" "$DOMAIN_ROOT/logs/php_error.log" "$PUBLIC_ROOT/error_log" "$HOME/domains/digebail.ir/logs/error.log" "$HOME/domains/digebail.ir/logs/php_error.log"; do
                 if [ -f "$LOG_FILE" ]; then
                   echo "ADMIN_PHP_LOG_FILE=$LOG_FILE"
                   tail -n 35 "$LOG_FILE" | sed -E 's/(password|token|secret|authorization)([=: ]+)[^ ]+/\\1\\2[REDACTED]/Ig'
                 fi
               done
             fi
             LEGACY_EXPERT_HTTP="$(curl -k -sS -o /dev/null -w '%{http_code}' https://digebail.ir/expert.html)"
             echo "LIVE_EXPERT_UNAUTH_HTTP=\$EXPERT_HTTP"
             echo "LIVE_ADMIN_UNAUTH_HTTP=\$ADMIN_HTTP"
             echo "LIVE_LEGACY_EXPERT_HTTP=\$LEGACY_EXPERT_HTTP"
             if [ "\$EXPERT_HTTP" != "302" ] || [ "\$ADMIN_HTTP" != "302" ] || [ "\$LEGACY_EXPERT_HTTP" != "404" ]; then
               echo 'ERROR: Admin/expert route protection verification failed.'
               exit 1
             fi
             head -c 160 /tmp/digebail-home-check.html 2>/dev/null || true"
