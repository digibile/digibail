name: Deploy DigiBail PHP 8.3 (isolated)

on:
  push:
    branches:
      - migration/php83-full-rebuild
    paths:
      - 'php/**'
      - '.github/workflows/deploy-php83-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digebail-php83-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PHP migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/php83-full-rebuild
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, openssl, pdo, pdo_mysql, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate, install dependencies and test
        working-directory: php
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --no-dev --prefer-dist --optimize-autoloader
          composer test
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify deployment credentials
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Configure pinned SSH host verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          ACTUAL="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | sort -u)"
          EXPECTED='SHA256:9bIljRY2O89S4QXg9v6zYuLfk39pK8nl69BOg7vP5os'
          if ! printf '%s\n' "$ACTUAL" | grep -Fxq "$EXPECTED"; then
            echo "::error::SSH host fingerprint mismatch. Deployment stopped."
            exit 1
          fi

      - name: Deploy private PHP application and public entry point
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DOMAIN_ROOT='/home/digibail/domains/digebail.ir'
          PRIVATE_APP="$DOMAIN_ROOT/php_app"
          PUBLIC_ROOT="$DOMAIN_ROOT/public_html"
          DEPLOY_ID="$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_ID"
          BACKUP_ROOT="$DOMAIN_ROOT/.deploy-backups/php83-$DEPLOY_ID"

          # Validate the exact DirectAdmin domain and prepare a private rollback area.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             test \"\$(realpath '$DOMAIN_ROOT')\" = '$DOMAIN_ROOT'
             test -d '$PUBLIC_ROOT'
             mkdir -p '$PRIVATE_APP' '$BACKUP_ROOT/php_app' '$BACKUP_ROOT/public_html'
             chmod 755 '$PRIVATE_APP' '$PUBLIC_ROOT'
             chmod 700 '$DOMAIN_ROOT/.deploy-backups' '$BACKUP_ROOT'"

          # Back up every existing private-app file that rsync will replace.
          # The live .env and all unrelated server files are explicitly excluded.
          rsync -az --no-owner --no-group --backup --backup-dir="$BACKUP_ROOT/php_app" \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude='.env' --exclude='.git/' \
            php/ "$DEPLOY_USER@$DEPLOY_HOST:$PRIVATE_APP/"

          # Add new public assets only. Existing public files are never overwritten.
          # index.php is handled separately after preserving its current version.
          rsync -az --no-owner --no-group --ignore-existing \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude='index.php' \
            php/public/ "$DEPLOY_USER@$DEPLOY_HOST:$PUBLIC_ROOT/"

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             if [ -e '$PUBLIC_ROOT/index.php' ] || [ -L '$PUBLIC_ROOT/index.php' ]; then
               cp -a '$PUBLIC_ROOT/index.php' '$BACKUP_ROOT/public_html/index.php'
               echo 'EXISTING_INDEX_BACKED_UP=1'
             else
               echo 'EXISTING_INDEX_BACKED_UP=0'
             fi
             # Keep the prior static landing page recoverable, but let PHP-FPM own the root route.
             if [ -e '$PUBLIC_ROOT/index.html' ] || [ -L '$PUBLIC_ROOT/index.html' ]; then
               cp -a '$PUBLIC_ROOT/index.html' '$BACKUP_ROOT/public_html/index.html'
               mv '$PUBLIC_ROOT/index.html' '$BACKUP_ROOT/public_html/index.html.disabled'
               echo 'EXISTING_STATIC_INDEX_BACKED_UP=1'
             fi
             cat > '$PUBLIC_ROOT/index.php' <<'PHP_ENTRY'
          <?php
          declare(strict_types=1);
          require dirname(__DIR__) . '/php_app/public/index.php';
          PHP_ENTRY
             chmod 644 '$PUBLIC_ROOT/index.php'
             test -s '$PRIVATE_APP/vendor/autoload.php'
             test -s '$PRIVATE_APP/public/home.html'
             php -l '$PUBLIC_ROOT/index.php'
             php -l '$PRIVATE_APP/public/index.php'
             if [ -f '$DOMAIN_ROOT/database/migration/config.php' ]; then
               /usr/local/php83/bin/php '$PRIVATE_APP/scripts/configure_production.php'
               chmod 600 '$PRIVATE_APP/.env'
               echo 'PHP_DATABASE_BOOTSTRAP=SUCCESS'
             else
               echo 'PHP_DATABASE_BOOTSTRAP=PENDING_CONFIG_FILE'
             fi
             echo 'PHP_FILES_TRANSFERRED=1'
             echo 'PRIVATE_APP_PATH=$PRIVATE_APP'
             echo 'PUBLIC_DOCUMENT_ROOT=$PUBLIC_ROOT'
             echo 'ROLLBACK_BACKUP=$BACKUP_ROOT'
             curl -k -sS -o /tmp/digebail-home-check.html -w 'LIVE_HOME_HTTP=%{http_code}\n' https://digebail.ir/ || true
             head -c 160 /tmp/digebail-home-check.html 2>/dev/null || true"
