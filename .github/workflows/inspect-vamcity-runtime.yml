name: Check VamCity migration runtime dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-vamcity-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check local MariaDB socket and migration runtime
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            echo "=== PHP MYSQL DRIVERS ==="
            if command -v php >/dev/null 2>&1; then php -v | head -n 1; php -m | grep -Ei '^(mysqli|pdo_mysql)$' || true; else echo "PHP_CLI_NOT_FOUND"; fi
            echo "=== PYTHON PACKAGE MANAGER ==="
            python3 --version
            python3 -m pip --version 2>&1 || true
            python3 -m venv --help >/dev/null 2>&1 && echo "VENV_AVAILABLE" || echo "VENV_UNAVAILABLE"
            echo "=== MYSQL SOCKET AUTH ==="
            mysql --batch --skip-column-names -e "SELECT CURRENT_USER(),VERSION(),@@datadir,@@character_set_server,@@collation_server;"
            echo "=== EXISTING DATABASE NAMES ONLY ==="
            mysql --batch --skip-column-names -e "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME LIKE 'vamcity%' OR SCHEMA_NAME='vamcitydigibilepay' ORDER BY SCHEMA_NAME;"
            echo "=== APP CONFIG CONNECTION STRING KEY NAMES ONLY ==="
            for f in /home/roofixo/domains/roofixo.ir/public_html/appsettings.json /home/roofixo/domains/roofixo.ir/public_html/appsettings.Production.json; do
              if [ -f "$f" ]; then
                python3 - "$f" <<'PY'
            import json,sys
            try:
                d=json.load(open(sys.argv[1],encoding='utf-8'))
                cs=d.get('ConnectionStrings',{})
                print(sys.argv[1], 'CONNECTION_KEYS=', ','.join(sorted(cs.keys())))
            except Exception as e:
                print(sys.argv[1], 'JSON_READ_ERROR', type(e).__name__)
            PY
              fi
            done
            echo "RUNTIME_INSPECTION_COMPLETE=1"
