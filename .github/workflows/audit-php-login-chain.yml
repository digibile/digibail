name: Read-only DigiBail PHP login chain audit

on:
  push:
    branches: [migration/php83-full-rebuild]
    paths:
      - .github/workflows/audit-php-login-chain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit production login path without changing account or database
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            APP="/home/digibail/domains/digebail.ir/php_app"
            echo "=== PRODUCTION PHP LOGIN CHAIN AUDIT ==="
            /usr/local/php83/bin/php -r '
              require $argv[1] . "/vendor/autoload.php";
              App\Core\Environment::load($argv[1] . "/.env");
              $db=App\Core\Database\ConnectionFactory::create();
              $q=$db->prepare("SELECT Id, UserName, NormalizedUserName, PasswordHash, IsActive, LockoutEnabled, LockoutEnd, AccessFailedCount FROM AspNetUsers WHERE Id = :id LIMIT 1");
              $q->execute(["id"=>"2897"]);
              $u=$q->fetch(PDO::FETCH_ASSOC);
              if (!$u) { echo "ADMIN_ROW_FOUND=0".PHP_EOL; exit(2); }
              echo "ADMIN_ROW_FOUND=1".PHP_EOL;
              echo "ACCOUNT_ACTIVE=".(int)$u["IsActive"].PHP_EOL;
              echo "USERNAME_PRESENT=".(($u["UserName"]??"")!==""?1:0).PHP_EOL;
              echo "NORMALIZED_USERNAME_MATCH=" . (((string)$u["NormalizedUserName"]===mb_strtoupper((string)$u["UserName"],"UTF-8"))?1:0) . PHP_EOL;
              $hash=(string)($u["PasswordHash"]??"");
              $info=password_get_info($hash);
              echo "PASSWORD_HASH_LENGTH=".strlen($hash).PHP_EOL;
              echo "PASSWORD_HASH_ALGORITHM=".($info["algoName"]??"unknown").PHP_EOL;
              echo "PASSWORD_HASH_COST=".(string)($info["options"]["cost"]??"unknown").PHP_EOL;
              echo "PASSWORD_HASH_BCRYPT_PREFIX=".(str_starts_with($hash,"$2")?1:0).PHP_EOL;
              echo "LOCKOUT_ENABLED=".(int)$u["LockoutEnabled"].PHP_EOL;
              echo "ACCESS_FAILED_COUNT=".(int)$u["AccessFailedCount"].PHP_EOL;
              $roles=$db->prepare("SELECT COUNT(*) FROM AspNetUserRoles ur INNER JOIN AspNetRoles r ON r.Id=ur.RoleId WHERE ur.UserId=:id");
              $roles->execute(["id"=>"2897"]);
              echo "LINKED_ROLE_COUNT=".(int)$roles->fetchColumn().PHP_EOL;
              $match=$db->prepare("SELECT COUNT(*) FROM AspNetUsers WHERE NormalizedUserName=:n OR UserName=:u");
              $match->execute(["n"=>mb_strtoupper((string)$u["UserName"],"UTF-8"),"u"=>(string)$u["UserName"]]);
              echo "USERNAME_MATCH_COUNT=".(int)$match->fetchColumn().PHP_EOL;
              $repo=new App\Identity\LegacyIdentityRepository($db);
              $result=$repo->authenticate((string)$u["UserName"],"DigiBail-read-only-auth-audit-invalid-sentinel");
              echo "SENTINEL_AUTH_REJECTED=".($result===null?1:0).PHP_EOL;
              echo "AUTHENTICATE_METHOD_COMPLETED=1".PHP_EOL;
            ' "$APP"
            echo "=== LOGIN FORM/API ROUTE CHECK ==="
            curl -k -sS -o /dev/null -w 'LOGIN_PAGE_HTTP=%{http_code}\n' https://digebail.ir/login.html
            curl -k -sS -o /dev/null -w 'EXPERT_UNAUTH_HTTP=%{http_code}\n' https://digebail.ir/expert.php
            echo "READ_ONLY_LOGIN_AUDIT=COMPLETED"
