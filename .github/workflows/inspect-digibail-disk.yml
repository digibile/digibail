name: Inspect Digibail production disk usage without changing data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-digibail-disk.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only disk and Docker inventory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 7m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; elif docker info >/dev/null 2>&1; then D="docker"; else echo "Docker unavailable"; exit 20; fi
            echo "=== Filesystem ==="
            df -hT /
            echo "=== Inode usage ==="
            df -ih /
            echo "=== Docker storage summary ==="
            $D system df -v
            echo "=== Top-level root usage ==="
            du -xhd1 / 2>/dev/null | sort -h | tail -25
            echo "=== Digibail project storage ==="
            du -xhd2 /home/digibail 2>/dev/null | sort -h | tail -35
            echo "=== Docker data root usage ==="
            DROOT="$($D info --format '{{.DockerRootDir}}')"
            echo "DOCKER_ROOT=$DROOT"
            du -xhd2 "$DROOT" 2>/dev/null | sort -h | tail -30
            echo "=== Large files (read-only, top 40) ==="
            find /home/digibail /var/log /root -xdev -type f -size +100M -printf '%s %p\n' 2>/dev/null | sort -nr | head -40
            echo "DISK_INSPECTION_COMPLETE=1"
