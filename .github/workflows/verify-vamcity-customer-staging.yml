name: Verify staged legacy customer records in Digibail production PostgreSQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vamcity-customer-staging.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read production migration counts without exposing customer data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 7m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; else D="docker"; fi
            echo "=== PRODUCTION DATABASE IDENTITY ==="
            $D compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT current_database(),current_schema(),version();"'
            echo "=== RAW LEGACY SOURCE TOTALS ==="
            $D compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT COUNT(*) AS raw_rows,COUNT(DISTINCT source_table) AS source_tables FROM legacy_source_data WHERE source_table <> chr(95)||chr(95)||chr(108)||chr(101)||chr(103)||chr(97)||chr(99)||chr(121)||chr(95)||chr(115)||chr(99)||chr(104)||chr(101)||chr(109)||chr(97);"'
            echo "=== CUSTOMER AND IDENTITY SOURCE TABLE COUNTS ==="
            $D compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT source_table,COUNT(*) AS rows FROM legacy_source_data WHERE source_table ~* chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(85)||chr(115)||chr(101)||chr(114)||chr(115)||chr(124)||chr(67)||chr(117)||chr(115)||chr(116)||chr(111)||chr(109)||chr(101)||chr(114)||chr(115)||chr(124)||chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(82)||chr(111)||chr(108)||chr(101)||chr(115)||chr(124)||chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(85)||chr(115)||chr(101)||chr(114)||chr(82)||chr(111)||chr(108)||chr(101)||chr(115)||chr(124)||chr(65)||chr(103)||chr(101)||chr(110)||chr(116)||chr(77)||chr(101)||chr(116)||chr(97)||chr(68)||chr(97)||chr(116)||chr(97)||chr(124)||chr(83)||chr(117)||chr(98)||chr(65)||chr(103)||chr(101)||chr(110)||chr(116)||chr(84)||chr(114)||chr(97)||chr(110)||chr(115)||chr(97)||chr(99)||chr(116)||chr(105)||chr(111)||chr(110)||chr(115)||chr(124)||chr(65)||chr(103)||chr(101)||chr(110)||chr(116)||chr(115)||chr(124)||chr(85)||chr(115)||chr(101)||chr(114)||chr(76)||chr(111)||chr(97)||chr(110)||chr(82)||chr(101)||chr(113)||chr(117)||chr(101)||chr(115)||chr(116)||chr(115)||chr(124)||chr(85)||chr(115)||chr(101)||chr(114)||chr(76)||chr(111)||chr(97)||chr(110);' -c "SELECT source_table,COUNT(*) AS rows FROM legacy_source_data GROUP BY source_table HAVING source_table ILIKE chr(37)||chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(85)||chr(115)||chr(101)||chr(114)||chr(115)||chr(37) OR source_table ILIKE chr(37)||chr(67)||chr(117)||chr(115)||chr(116)||chr(111)||chr(109)||chr(101)||chr(114)||chr(115)||chr(37) OR source_table ILIKE chr(37)||chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(82)||chr(111)||chr(108)||chr(101)||chr(115)||chr(37) OR source_table ILIKE chr(37)||chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(85)||chr(115)||chr(101)||chr(114)||chr(82)||chr(111)||chr(108)||chr(101)||chr(115)||chr(37) OR source_table ILIKE chr(37)||chr(65)||chr(103)||chr(101)||chr(110)||chr(116)||chr(77)||chr(101)||chr(116)||chr(97)||chr(68)||chr(97)||chr(116)||chr(97)||chr(37) OR source_table ILIKE chr(37)||chr(83)||chr(117)||chr(98)||chr(65)||chr(103)||chr(101)||chr(110)||chr(116)||chr(84)||chr(114)||chr(97)||chr(110)||chr(115)||chr(97)||chr(99)||chr(116)||chr(105)||chr(111)||chr(110)||chr(115)||chr(37) OR source_table ILIKE chr(37)||chr(65)||chr(103)||chr(101)||chr(110)||chr(116)||chr(115)||chr(37) OR source_table ILIKE chr(37)||chr(85)||chr(115)||chr(101)||chr(114)||chr(76)||chr(111)||chr(97)||chr(110)||chr(82)||chr(101)||chr(113)||chr(117)||chr(101)||chr(115)||chr(116)||chr(115)||chr(37) GROUP BY source_table ORDER BY source_table"'
            echo "=== MATERIALIZED CUSTOMER AND USER COUNTS ==="
            $D compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT (SELECT COUNT(*) FROM users) AS users_total,(SELECT COUNT(*) FROM users WHERE legacy_source=''aspnetusers'') AS legacy_users,(SELECT COUNT(*) FROM legacy_customers) AS legacy_customers_total,(SELECT COUNT(*) FROM legacy_customers WHERE legacy_source_table ILIKE chr(37)||chr(46)||chr(100)||chr(98)||chr(111)||chr(46)||chr(99)||chr(117)||chr(115)||chr(116)||chr(111)||chr(109)||chr(101)||chr(114)||chr(115)) AS business_customers,(SELECT COUNT(*) FROM legacy_customers WHERE legacy_source_table ILIKE chr(37)||chr(46)||chr(100)||chr(98)||chr(111)||chr(97)||chr(115)||chr(112)||chr(110)||chr(101)||chr(116)||chr(117)||chr(115)||chr(101)||chr(114)||chr(115)) AS login_account_customers;"'
            echo "=== STAGING VERIFICATION COMPLETE ==="
