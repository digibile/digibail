name: Verify staged legacy customer records in Digibail production PostgreSQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vamcity-customer-staging.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read production customer migration counts without exposing personal data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 7m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; else D="docker"; fi
            echo "=== DATABASE ==="
            $D compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT current_database(),version();"'
            echo "=== RAW LEGACY TOTALS ==="
            $D compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            SELECT COUNT(*) AS raw_rows,COUNT(DISTINCT source_table) AS source_tables
            FROM legacy_source_data WHERE source_table <> '__legacy_schema__';
            SELECT source_table,COUNT(*) AS rows
            FROM legacy_source_data
            WHERE source_table ILIKE '%AspNetUsers%'
               OR source_table ILIKE '%AspNetRoles%'
               OR source_table ILIKE '%AspNetUserRoles%'
               OR source_table ILIKE '%Customers%'
               OR source_table ILIKE '%AgentMetaData%'
               OR source_table ILIKE '%SubAgentTransactions%'
            GROUP BY source_table ORDER BY source_table;
            SQL
            echo "=== MATERIALIZED TARGET TOTALS ==="
            $D compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            SELECT (SELECT COUNT(*) FROM users) AS users_total,
                   (SELECT COUNT(*) FROM users WHERE legacy_source='aspnetusers') AS legacy_users,
                   (SELECT COUNT(*) FROM legacy_customers) AS legacy_customers_total;
            SELECT COUNT(*) AS business_customer_records
            FROM legacy_customers
            WHERE legacy_source_table ILIKE '%.dbo.Customers';
            SELECT COUNT(*) AS login_account_records
            FROM legacy_customers
            WHERE legacy_source_table ILIKE '%.dbo.AspNetUsers';
            SQL
            echo "STAGING_COUNTS_COMPLETE=1"
