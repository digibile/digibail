name: Recover Digibail database from stale cross-project locks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-recover-db-locks.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Terminate only identified stale VamCity and blocked migration sessions
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; elif docker info >/dev/null 2>&1; then D="docker"; else echo "BLOCKED: Docker unavailable"; exit 20; fi
            echo "=== Verify the exact stale sessions identified in pg_stat_activity ==="
            $D compose exec -T db sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -x -c "SELECT pid,client_addr,backend_start,query_start,state,wait_event_type,wait_event,left(query,220) AS query FROM pg_stat_activity WHERE pid IN (122369,123138,123581,124112)"'
            echo "=== Terminate only those four previously verified stale sessions ==="
            $D compose exec -T db sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT pid,pg_terminate_backend(pid) AS terminated FROM pg_stat_activity WHERE pid IN (122369,123138,123581,124112)"'
            echo "=== Verify the stale sessions are gone ==="
            $D compose exec -T db sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT pid,client_addr,state,wait_event_type,pg_blocking_pids(pid) AS blockers,left(query,180) AS query FROM pg_stat_activity WHERE pid IN (122369,123138,123581,124112)"'
            echo "=== Verify the loan_requests lock queue is clear ==="
            $D compose exec -T db sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT pid,state,wait_event_type,wait_event,pg_blocking_pids(pid) AS blockers,now()-query_start AS duration,left(query,180) AS query FROM pg_stat_activity WHERE datname=current_database() AND query LIKE chr(67)||chr(82)||chr(69)||chr(65)||chr(84)||chr(69)||chr(32)||chr(84)||chr(65)||chr(66)||chr(76)||chr(69)||chr(32)||chr(73)||chr(70)||chr(32)||chr(78)||chr(79)||chr(84)||chr(32)||chr(69)||chr(88)||chr(73)||chr(83)||chr(84)||chr(83)||chr(32)||chr(108)||chr(111)||chr(97)||chr(110)||chr(95)||chr(114)||chr(101)||chr(113)||chr(117)||chr(101)||chr(115)||chr(116)"'
