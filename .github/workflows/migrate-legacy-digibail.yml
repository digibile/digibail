name: Migrate legacy Digibail accounts and SMS patterns

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/migrate-legacy-digibail.yml

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate SSH settings
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing repository secret: $name"; exit 1; fi
          done
      - name: Back up and migrate legacy records
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then DOCKER="sudo -n docker"; elif docker info >/dev/null 2>&1; then DOCKER="docker"; else echo "DOCKER_ACCESS=UNAVAILABLE"; exit 20; fi
            echo "=== wait for updated app and schema ==="
            READY=0
            for n in $(seq 1 90); do
              APP_ID="$($DOCKER compose ps -q app 2>/dev/null || true)"
              if [ -n "$APP_ID" ] && $DOCKER exec "$APP_ID" test -f /app/web/admin.html 2>/dev/null && $DOCKER exec "$APP_ID" test -f /app/scripts/migrate-legacy-digibail.js 2>/dev/null && $DOCKER exec "$APP_ID" grep -q "genericTables ||" /app/scripts/migrate-legacy-digibail.js 2>/dev/null; then
                if $DOCKER compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT to_regclass('\''public.sms_templates'\'') IS NOT NULL AND to_regclass('\''public.legacy_customers'\'') IS NOT NULL"' 2>/dev/null | grep -qx t; then READY=1; break; fi
              fi
              sleep 10
            done
            if [ "$READY" -ne 1 ]; then echo "BLOCKED: updated app/schema not active; no data changed."; exit 21; fi
            echo "TARGET_RELEASE_READY=1"
            BACKUP_DIR="$ROOT/.migration-backups"; mkdir -p "$BACKUP_DIR"; chmod 700 "$BACKUP_DIR"
            BACKUP="$BACKUP_DIR/digibail-before-legacy-$(date +%Y%m%d%H%M%S).sql.gz"
            $DOCKER compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' | gzip > "$BACKUP"
            chmod 600 "$BACKUP"; test -s "$BACKUP"; echo "TARGET_BACKUP_CREATED=1"
            SQLC="public_html-db-1"; $DOCKER inspect "$SQLC" >/dev/null
            SQLCMD="/opt/mssql-tools18/bin/sqlcmd"
            $DOCKER exec "$SQLC" test -x "$SQLCMD" || SQLCMD="/opt/mssql-tools/bin/sqlcmd"
            $DOCKER exec "$SQLC" test -x "$SQLCMD"
            # Authenticate with the SQL Server container's configured SA password first; fall back to app login.
            SA_PASS="$($DOCKER inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$SQLC" | sed -n -e 's/^MSSQL_SA_PASSWORD=//p' -e 's/^SA_PASSWORD=//p' | head -1)"
            CONN="$($DOCKER inspect --format '{{range .Config.Env}}{{println .}}{{end}}' public_html-web-1 | sed -n 's/^ConnectionStrings__DefaultConnection=//p' | head -1)"
            CREDS=""
            if [ -n "$CONN" ]; then
              CREDS="$(CONN="$CONN" node -e 'const s=process.env.CONN;const o={};for(const p of s.split(";")){const i=p.indexOf("=");if(i>0)o[p.slice(0,i).trim().toLowerCase()]=p.slice(i+1).trim()}const pick=(...k)=>k.map(x=>o[x]).find(Boolean)||"";console.log(pick("initial catalog","database"));console.log(pick("user id","uid","user"));console.log(pick("password","pwd"));')"
            fi
            DB="$(printf '%s\n' "$CREDS" | sed -n '1p')"
            APP_USER="$(printf '%s\n' "$CREDS" | sed -n '2p')"
            APP_PASS="$(printf '%s\n' "$CREDS" | sed -n '3p')"
            if [ -z "$DB" ]; then echo "BLOCKED: legacy database name could not be parsed."; exit 22; fi
            DB_USER=""; DB_PASS=""
            if [ -n "$SA_PASS" ] && $DOCKER exec -e SQLCMDPASSWORD="$SA_PASS" "$SQLC" "$SQLCMD" -S localhost -U sa -C -b -d "$DB" -Q "SET NOCOUNT ON; SELECT 1" >/dev/null 2>&1; then
              DB_USER="sa"; DB_PASS="$SA_PASS"; echo "LEGACY_SQL_AUTH=container_sa"
            elif [ -n "$APP_USER" ] && [ -n "$APP_PASS" ] && $DOCKER exec -e SQLCMDPASSWORD="$APP_PASS" "$SQLC" "$SQLCMD" -S localhost -U "$APP_USER" -C -b -d "$DB" -Q "SET NOCOUNT ON; SELECT 1" >/dev/null 2>&1; then
              DB_USER="$APP_USER"; DB_PASS="$APP_PASS"; echo "LEGACY_SQL_AUTH=application_login"
            else
              unset SA_PASS APP_PASS
              echo "BLOCKED: SQL Server rejected available credentials; no legacy rows were imported."
              exit 22
            fi
            unset APP_PASS SA_PASS
            TMP="$(mktemp -d /tmp/digibail-legacy-migration.XXXXXX)"; chmod 700 "$TMP"
            trap 'rm -rf "$TMP"; $DOCKER exec "$APP_ID" rm -f /tmp/legacy-migration.json >/dev/null 2>&1 || true' EXIT
            Q_USERS="SET NOCOUNT ON; SELECT CAST(u.Id AS nvarchar(40)) AS legacyId, NULLIF(LTRIM(RTRIM(u.UserName)),'') AS username, NULLIF(LTRIM(RTRIM(CONCAT(ISNULL(u.FirstName,''),' ',ISNULL(u.LastName,'')))),'') AS fullName, NULLIF(LTRIM(RTRIM(u.Email)),'') AS email, NULLIF(LTRIM(RTRIM(u.NationalCode)),'') AS nationalCode, NULLIF(LTRIM(RTRIM(u.PasswordHash)),'') AS passwordHash, CAST(u.IsActive AS bit) AS isActive, COALESCE(NULLIF(LTRIM(RTRIM(u.Mobile)),''),NULLIF(LTRIM(RTRIM(u.Phone)),'')) AS phone, COALESCE((SELECT STRING_AGG(r.Name, ',') FROM AspNetUserRoles ur JOIN AspNetRoles r ON r.Id=ur.RoleId WHERE ur.UserId=u.Id),'') AS roles, u.RegDate AS createdAt FROM AspNetUsers u FOR JSON PATH;"
            Q_CUSTOMERS="SET NOCOUNT ON; SELECT CONVERT(nvarchar(36),Id) AS legacyId, Name AS name, Mobile AS mobile, Email AS email, Code AS code, RegDate AS createdAt, ExpireDate AS expiresAt, Permanent AS permanent, Purchased AS purchased, AffCode AS affiliateCode, ParkDomain AS parkedDomain FROM Customers FOR JSON PATH;"
            Q_SMS="SET NOCOUNT ON; SELECT CONVERT(nvarchar(36),Id) AS legacyId, Title AS title, Pattern AS pattern, IsSystem AS isSystem, Status AS status, Category AS category, SmsPatternPanel AS providerPanel, IsPatternBase AS isPatternBase, PatternBaseCode AS patternBaseCode, RejectReason AS rejectReason, CONVERT(nvarchar(36),CustomerId) AS legacyCustomerId FROM SmsPatterns FOR JSON PATH;"
            Q_PLANS="SET NOCOUNT ON; SELECT ROW_NUMBER() OVER (ORDER BY (SELECT NULL)) AS legacyRow, p.* FROM dbo.CustomerPurchasePlan p FOR JSON PATH;"
            Q_STATUSES="SET NOCOUNT ON; SELECT ROW_NUMBER() OVER (ORDER BY (SELECT NULL)) AS legacyRow, s.* FROM dbo.LoanRequestStatuses s FOR JSON PATH;"
            Q_ROLES="SET NOCOUNT ON; SELECT ROW_NUMBER() OVER (ORDER BY (SELECT NULL)) AS legacyRow, r.* FROM dbo.AspNetRoles r FOR JSON PATH;"
            Q_USER_ROLES="SET NOCOUNT ON; SELECT ROW_NUMBER() OVER (ORDER BY (SELECT NULL)) AS legacyRow, ur.* FROM dbo.AspNetUserRoles ur FOR JSON PATH;"
            Q_CLAIMS="SET NOCOUNT ON; SELECT ROW_NUMBER() OVER (ORDER BY (SELECT NULL)) AS legacyRow, c.* FROM dbo.AspNetUserClaims c FOR JSON PATH;"
            for item in "users|$Q_USERS" "customers|$Q_CUSTOMERS" "sms|$Q_SMS" "plans|$Q_PLANS" "statuses|$Q_STATUSES" "roles|$Q_ROLES" "userroles|$Q_USER_ROLES" "claims|$Q_CLAIMS"; do
              name="${item%%|*}"; query="${item#*|}"
              echo "EXPORT_TABLE=$name"
              if ! $DOCKER exec -e SQLCMDPASSWORD="$DB_PASS" "$SQLC" "$SQLCMD" -S localhost -U "$DB_USER" -C -b -w 65535 -y 0 -d "$DB" -Q "$query" > "$TMP/$name.raw" 2> "$TMP/$name.err"; then
                echo "LEGACY_EXPORT_QUERY_FAILED=$name"
                sed -E 's/(password|pwd|token|secret)[^; ]*/[redacted]/Ig' "$TMP/$name.err" | tail -n 12
                exit 23
              fi
              # Extract the JSON array independently of sqlcmd's version-specific headers and separators.
              node - "$TMP/$name.raw" "$TMP/$name.json" <<'NODEJSON'
              const fs=require("node:fs");
              const raw=fs.readFileSync(process.argv[2],"utf8").replace(/\\r/g,"");
              const first=raw.indexOf("[");
              const last=raw.lastIndexOf("]");
              if(first<0||last<first) { console.error("SQLCMD output did not contain a JSON array"); process.exit(1); }
              const value=raw.slice(first,last+1).replace(/[\r\n]/g,"");
              JSON.parse(value);
              fs.writeFileSync(process.argv[3],value);
            NODEJSON
              test -s "$TMP/$name.json"
            done
            echo "=== Export all remaining legacy tables without changing their source schema ==="
            $DOCKER exec -e SQLCMDPASSWORD="$DB_PASS" "$SQLC" "$SQLCMD" -S localhost -U "$DB_USER" -C -b -h -1 -W -w 65535 -d "$DB" -Q "SET NOCOUNT ON; SELECT s.name + '.' + t.name FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id WHERE t.is_ms_shipped=0 ORDER BY s.name,t.name" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$TMP/generic-table-list.txt"
            schema_query="SET NOCOUNT ON; SELECT s.name + '.' + t.name AS sourceTable, COALESCE((SELECT SUM(p.rows) FROM sys.partitions p WHERE p.object_id=t.object_id AND p.index_id IN (0,1)),0) AS rowCount, c.name AS columnName, TYPE_NAME(c.user_type_id) AS dataType, c.max_length AS maxLength, c.is_nullable AS isNullable FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id JOIN sys.columns c ON c.object_id=t.object_id WHERE t.is_ms_shipped=0 ORDER BY s.name,t.name,c.column_id FOR JSON PATH, INCLUDE_NULL_VALUES;"
            if ! $DOCKER exec -e SQLCMDPASSWORD="$DB_PASS" "$SQLC" "$SQLCMD" -S localhost -U "$DB_USER" -C -b -h -1 -W -w 65535 -y 0 -d "$DB" -Q "$schema_query" > "$TMP/schema.raw" 2> "$TMP/schema.err"; then
              echo "LEGACY_SCHEMA_EXPORT_FAILED=1"
              sed -E 's/(password|pwd|token|secret)[^; ]*/[redacted]/Ig' "$TMP/schema.err" | tail -n 12
              echo "LEGACY_SCHEMA_ERROR_OUTPUT_BEGIN"
              sed -E 's/(password|pwd|token|secret)[^; ]*/[redacted]/Ig' "$TMP/schema.raw" | head -n 20
              echo "LEGACY_SCHEMA_ERROR_OUTPUT_END"
              exit 25
            fi
            node - "$TMP/schema.raw" "$TMP/schema.json" <<'NODEJSON'
            const fs=require("node:fs");
            const raw=fs.readFileSync(process.argv[2],"utf8").replace(/\r/g,"");
            const first=raw.indexOf("[");
            const last=raw.lastIndexOf("]");
            if(first<0||last<first) { console.error("Legacy schema export did not contain JSON"); process.exit(1); }
            const value=raw.slice(first,last+1).replace(/[\r\n]/g,"");
            const rows=JSON.parse(value);
            const definitions=new Map();
            for(const row of rows){
              let item=definitions.get(row.sourceTable);
              if(!item){item={sourceTable:row.sourceTable,rowCount:Number(row.rowCount)||0,columns:[]};definitions.set(row.sourceTable,item);}
              item.columns.push({name:row.columnName,dataType:row.dataType,maxLength:row.maxLength,isNullable:row.isNullable});
            }
            fs.writeFileSync(process.argv[3],JSON.stringify([...definitions.values()]),{mode:0o600});
            NODEJSON
            : > "$TMP/generic-manifest.tsv"
            GENERIC_INDEX=0
            while IFS= read -r full_table; do
              [ -n "$full_table" ] || continue
              schema_name="${full_table%%.*}"
              table_name="${full_table#*.}"
              schema_quoted="$(printf '%s' "$schema_name" | sed 's/]/]]/g')"
              table_quoted="$(printf '%s' "$table_name" | sed 's/]/]]/g')"
              GENERIC_INDEX=$((GENERIC_INDEX + 1))
              json_file="generic-$GENERIC_INDEX.json"
              query="SET NOCOUNT ON; SELECT * FROM [$schema_quoted].[$table_quoted] FOR JSON PATH, INCLUDE_NULL_VALUES;"
              echo "EXPORT_LEGACY_TABLE=$full_table"
              if ! $DOCKER exec -e SQLCMDPASSWORD="$DB_PASS" "$SQLC" "$SQLCMD" -S localhost -U "$DB_USER" -C -b -w 65535 -y 0 -d "$DB" -Q "$query" > "$TMP/$json_file.raw" 2> "$TMP/$json_file.err"; then
                echo "LEGACY_GENERIC_EXPORT_FAILED=$full_table"
                sed -E 's/(password|pwd|token|secret)[^; ]*/[redacted]/Ig' "$TMP/$json_file.err" | tail -n 12
                exit 24
              fi
              node - "$TMP/$json_file.raw" "$TMP/$json_file" <<'NODEJSON'
              const fs=require("node:fs");
              const raw=fs.readFileSync(process.argv[2],"utf8").replace(/\r/g,"");
              const first=raw.indexOf("[");
              const last=raw.lastIndexOf("]");
              if(first<0||last<first) { if(raw.trim()===""){ fs.writeFileSync(process.argv[3],"[]",{mode:0o600}); process.exit(0); } console.error("SQLCMD output did not contain a JSON array"); process.exit(1); }
              const value=raw.slice(first,last+1).replace(/[\r\n]/g,"");
              JSON.parse(value);
              fs.writeFileSync(process.argv[3],value,{mode:0o600});
            NODEJSON
              printf '%s\t%s\n' "$full_table" "$json_file" >> "$TMP/generic-manifest.tsv"
            done < "$TMP/generic-table-list.txt"
            node - "$TMP" <<'NODE'
            const fs=require("node:fs"),p=require("node:path"),d=process.argv[2];
            const read=n=>JSON.parse(fs.readFileSync(p.join(d,n),"utf8").trim()||"[]");
            const genericTables=[];
            for(const line of fs.readFileSync(p.join(d,"generic-manifest.tsv"),"utf8").split(/\r?\n/).filter(Boolean)){
              const [sourceTable,file]=line.split("\t");
              genericTables.push({sourceTable,rows:read(file)});
            }
            const data={users:read("users.json"),customers:read("customers.json"),smsPatterns:read("sms.json"),purchasePlans:read("plans.json"),loanRequestStatuses:read("statuses.json"),identityRoles:read("roles.json"),identityUserRoles:read("userroles.json"),identityClaims:read("claims.json"),genericTables,schemaDefinitions:read("schema.json")};
            fs.writeFileSync(p.join(d,"input.json"),JSON.stringify(data),{mode:0o600});
            console.log("LEGACY_EXPORT_COUNTS="+JSON.stringify({users:data.users.length,customers:data.customers.length,smsPatterns:data.smsPatterns.length,purchasePlans:data.purchasePlans.length,loanRequestStatuses:data.loanRequestStatuses.length,identityRoles:data.identityRoles.length,identityUserRoles:data.identityUserRoles.length,identityClaims:data.identityClaims.length,genericTableCount:genericTables.length,genericRowCount:genericTables.reduce((n,t)=>n+t.rows.length,0),schemaDefinitions:schemaDefinitions.length}));
            NODE
            chmod 600 "$TMP/input.json"
            $DOCKER cp "$TMP/input.json" "$APP_ID:/tmp/legacy-migration.json"
            $DOCKER exec -u 0 "$APP_ID" chown node:node /tmp/legacy-migration.json
            $DOCKER exec "$APP_ID" node /app/scripts/migrate-legacy-digibail.js /tmp/legacy-migration.json
            $DOCKER compose exec -T db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM users; SELECT COUNT(*) FROM legacy_customers; SELECT COUNT(*) FROM sms_templates;"'
            echo "LEGACY_MIGRATION_COMPLETED=1"
            unset DB_PASS CONN CREDS
