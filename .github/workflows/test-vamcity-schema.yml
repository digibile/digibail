name: Validate VamCity single reference database

on:
  push:
    branches:
      - migration/vamcitydigibilepay-linux-reference
    paths:
      - database/mysql/schema-main.sql
      - database/migration/migrate.php
      - database/migration/config.example.php
      - .github/workflows/test-vamcity-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mariadb-reference-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: vamcity_schema_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/vamcitydigibilepay-linux-reference
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y mariadb-client php-cli
      - name: Validate PHP syntax
        run: php -l database/migration/migrate.php && php -l database/migration/config.example.php
      - name: Create the single canonical database
        env:
          MYSQL_PWD: vamcity_schema_test
        run: |
          set -euo pipefail
          mysql --skip-ssl -h 127.0.0.1 -uroot -e "CREATE DATABASE vamcitydigibilepay CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - name: Import the primary VamCity schema
        env:
          MYSQL_PWD: vamcity_schema_test
        run: |
          set -euo pipefail
          mysql --skip-ssl -h 127.0.0.1 -uroot vamcitydigibilepay < database/mysql/schema-main.sql
      - name: Assert reference schema inventory
        env:
          MYSQL_PWD: vamcity_schema_test
        run: |
          set -euo pipefail
          tables=$(mysql --skip-ssl -h 127.0.0.1 -uroot --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='vamcitydigibilepay' AND table_type='BASE TABLE'")
          fks=$(mysql --skip-ssl -h 127.0.0.1 -uroot --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='vamcitydigibilepay'")
          raw=$(mysql --skip-ssl -h 127.0.0.1 -uroot --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='vamcitydigibilepay' AND column_name LIKE '__raw_%'")
          echo "tables=$tables foreign_keys=$fks temporal_raw_columns=$raw"
          test "$tables" -eq 88
          test "$fks" -eq 188
          test "$raw" -gt 0
          mysql --skip-ssl -h 127.0.0.1 -uroot vamcitydigibilepay -e "SHOW TABLES"
