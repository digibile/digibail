name: Final Digibail production and relational explorer verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-final-live-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live health, admin login, relational explorer and PostgreSQL
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 14m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            cd "$ROOT"
            if sudo -n docker info >/dev/null 2>&1; then D="sudo -n docker"; elif docker info >/dev/null 2>&1; then D="docker"; else echo "BLOCKED: Docker unavailable"; exit 20; fi
            echo "=== Public production health ==="
            curl -fsS --max-time 15 https://digebail.ir/healthz
            echo
            curl -fsS --max-time 15 -o /dev/null -w 'PUBLIC_LOGIN_HTTP=%{http_code}\n' https://digebail.ir/login.html
            echo "=== Actual relational manifest and original Digibail entity counts ==="
            $D compose exec -T db sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT
              (SELECT count(*) FROM legacy_digibail._import_manifest) AS relational_manifest_tables,
              (SELECT count(*) FILTER (WHERE imported_rows>0) FROM legacy_digibail._import_manifest) AS tables_with_imported_rows,
              (SELECT coalesce(sum(imported_rows),0) FROM legacy_digibail._import_manifest) AS total_relational_rows,
              (SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname=chr(108)||chr(101)||chr(103)||chr(97)||chr(99)||chr(121)||chr(95)||chr(100)||chr(105)||chr(103)||chr(105)||chr(98)||chr(97)||chr(105)) AS physical_relational_tables,
              (SELECT count(*) FROM legacy_source_data WHERE source_table=chr(100)||chr(98)||chr(111)||chr(46)||chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(85)||chr(115)||chr(101)||chr(114)||chr(115)) AS original_users,
              (SELECT count(*) FROM legacy_source_data WHERE source_table=chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(82)||chr(111)||chr(108)||chr(101)||chr(115)) AS original_roles,
              (SELECT count(*) FROM legacy_source_data WHERE source_table=chr(65)||chr(115)||chr(112)||chr(78)||chr(101)||chr(116)||chr(85)||chr(115)||chr(101)||chr(114)||chr(82)||chr(111)||chr(108)||chr(101)||chr(115)) AS original_user_role_links,
              (SELECT count(*) FROM legacy_source_data WHERE source_table=chr(100)||chr(98)||chr(111)||chr(46)||chr(67)||chr(117)||chr(115)||chr(116)||chr(111)||chr(109)||chr(101)||chr(114)||chr(115)) AS original_customers,
              (SELECT count(*) FROM legacy_source_data WHERE source_table=chr(100)||chr(98)||chr(111)||chr(46)||chr(83)||chr(109)||chr(115)||chr(80)||chr(97)||chr(116)||chr(116)||chr(101)||chr(114)||chr(110)||chr(115)) AS original_sms_patterns,
              (SELECT count(*) FROM legacy_source_data WHERE source_table=chr(100)||chr(98)||chr(111)||chr(46)||chr(65)||chr(103)||chr(101)||chr(110)||chr(76)||chr(111)||chr(97)||chr(110)||chr(115)) AS original_agent_loans,
              (SELECT count(*) FROM legacy_source_data WHERE source_table=chr(100)||chr(98)||chr(111)||chr(46)||chr(65)||chr(103)||chr(101)||chr(110)||chr(77)||chr(101)||chr(116)||chr(97)||chr(68)||chr(97)||chr(116)||chr(97)) AS original_agent_metadata,
              (SELECT count(*) FROM legacy_source_data WHERE source_table=chr(100)||chr(98)||chr(111)||chr(46)||chr(83)||chr(117)||chr(98)||chr(65)||chr(103)||chr(101)||chr(110)||chr(116)||chr(84)||chr(114)||chr(97)||chr(110)||chr(115)||chr(97)||chr(99)||chr(116)||chr(105)||chr(111)||chr(110)||chr(115)) AS original_subagent_transactions,
              (SELECT count(*) FROM users WHERE legacy_source=chr(97)||chr(115)||chr(112)||chr(110)||chr(101)||chr(116)||chr(117)||chr(115)||chr(101)||chr(114)||chr(115)) AS canonical_legacy_users,
              (SELECT count(*) FROM access_roles) AS canonical_roles,
              (SELECT count(*) FROM user_role_assignments) AS canonical_role_assignments,
              (SELECT count(*) FROM legacy_customers) AS canonical_legacy_customers,
              (SELECT count(*) FROM legacy_source_data WHERE left(source_table,9)=chr(118)||chr(97)||chr(109)||chr(99)||chr(105)||chr(116)||chr(121)||chr(99)||chr(95)) AS remaining_vamcity_archive_rows"'
            echo "=== Authenticated admin and relational explorer API smoke ==="
            RECOVERY_PASSWORD="$($D run --rm -v /:/host alpine:3.20 sh -c "sed -n 's/^password=//p' /host/root/digibail-admin-recovery.txt | head -n 1")"
            if ! printf '%s' "$RECOVERY_PASSWORD" | grep -Eq '^[a-f0-9]{48}$'; then echo "ERROR: recovery credential file is invalid."; exit 30; fi
            export RECOVERY_PASSWORD
            node --input-type=module <<'NODE'
            const base = "http://127.0.0.1:1631";
            const password = process.env.RECOVERY_PASSWORD || "";
            const captchaResponse = await fetch(base + "/api/v1/security/captcha");
            if (!captchaResponse.ok) throw new Error("Captcha endpoint failed: " + captchaResponse.status);
            const challenge = await captchaResponse.json();
            const encoded = String(challenge.image || "").split(",")[1] || "";
            const svg = Buffer.from(encoded, "base64").toString("utf8");
            const match = svg.match(/<text[^>]*>([0-9]{5})<[/]text>/);
            if (!challenge.id || !match) throw new Error("Could not read generated captcha");
            const login = await fetch(base + "/api/v1/security/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: "digibail-recovery", password, captchaId: challenge.id, captchaAnswer: match[1] })
            });
            const cookie = String(login.headers.get("set-cookie") || "").split(";")[0];
            if (!login.ok || !cookie.startsWith("db_session=")) throw new Error("Admin login failed: " + login.status);
            const headers = { Cookie: cookie };
            const summary = await fetch(base + "/api/v1/admin/summary", { headers });
            if (!summary.ok) throw new Error("Admin summary API failed: " + summary.status);
            const tablesResponse = await fetch(base + "/api/v1/admin/legacy-relational-tables", { headers });
            if (!tablesResponse.ok) throw new Error("Relational tables API failed: " + tablesResponse.status);
            const tables = await tablesResponse.json();
            console.log("MANIFEST_RESPONSE_TYPE=" + (Array.isArray(tables) ? "array" : typeof tables));
            console.log("MANIFEST_RESPONSE_COUNT=" + (Array.isArray(tables) ? tables.length : "n/a"));
            if (!Array.isArray(tables) || tables.length < 50) throw new Error("Relational table manifest incomplete: " + JSON.stringify(tables).slice(0,1200));
            const populated = tables.filter(t => Number(t.imported_rows) > 0);
            if (populated.length !== 11) throw new Error("Unexpected number of populated source tables: " + populated.length);
            let testedRows = 0;
            let paginationTested = false;
            for (const table of populated) {
              if (!table.source_schema || !table.source_table) throw new Error("Malformed manifest entry");
              const tableName = table.source_schema + "." + table.source_table;
              const endpoint = base + "/api/v1/admin/legacy-relational-data?table=" + encodeURIComponent(tableName);
              const response = await fetch(endpoint + "&offset=0&limit=50", { headers });
              if (!response.ok) {
                const detail = await response.text();
                console.log("RELATIONAL_DATA_ERROR table=" + tableName + " body=" + detail.slice(0,1500));
                throw new Error("Relational table data API failed for " + tableName + ": " + response.status);
              }
              const data = await response.json();
              if (!Array.isArray(data.columns) || data.columns.length === 0) throw new Error("Relational column metadata missing for " + tableName);
              if (!Array.isArray(data.rows) || !Array.isArray(data.primaryKeys) || !Array.isArray(data.foreignKeys) || data.primaryKeys.length === 0) throw new Error("Relational data shape or primary key invalid for " + tableName);
              if (Number(data.total) !== Number(table.imported_rows)) throw new Error("Relational row count mismatch for " + tableName);
              const expected = Math.min(50, Number(table.imported_rows));
              if (data.rows.length !== expected) throw new Error("Relational first page count mismatch for " + tableName);
              testedRows += data.rows.length;
              if (!paginationTested && Number(data.total) > 50) {
                const nextResponse = await fetch(endpoint + "&offset=50&limit=50", { headers });
                if (!nextResponse.ok) throw new Error("Relational pagination API failed for " + tableName);
                const next = await nextResponse.json();
                if (next.rows.length !== Math.min(50, Number(data.total)-50) || Number(next.total) !== Number(data.total)) throw new Error("Relational pagination count mismatch for " + tableName);
                paginationTested = true;
              }
              console.log("RELATIONAL_TABLE_PASS=" + tableName + " rows=" + data.total + " columns=" + data.columns.length + " pk=" + data.primaryKeys.length + " fk=" + data.foreignKeys.length);
            }
            if (!paginationTested) throw new Error("No populated table available for pagination test");
            const page = await fetch(base + "/admin.html", { headers });
            const html = await page.text();
            if (!page.ok || !html.includes("تمام داده‌های منتقل‌شده")) throw new Error("Admin relational explorer page not found");
            console.log("ADMIN_LOGIN=PASS");
            console.log("ADMIN_SUMMARY_API=PASS");
            console.log("RELATIONAL_TABLE_MANIFEST=PASS tables=" + tables.length + " populated=" + populated.length);
            console.log("RELATIONAL_DATA_API=PASS populated_tables=" + populated.length + " first_page_rows=" + testedRows + " pagination=PASS");
            console.log("ADMIN_EXPLORER_PAGE=PASS");
            NODE
            unset RECOVERY_PASSWORD
            echo "=== No schema migration or data rewrite is run during final verification ==="
            echo "=== Final database and disk metrics ==="
            $D compose exec -T db sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT pg_size_pretty(pg_database_size(current_database())) AS database_size"'
            echo "=== Docker storage usage (read-only; diagnostic may be incomplete) ==="
            $D system df || echo "DOCKER_SYSTEM_DF_UNAVAILABLE=1"
            echo "=== Filesystem and inode usage (read-only) ==="
            df -h /home/digibail
            df -i /home/digibail
            echo "=== Top-level filesystem usage (read-only) ==="
            for path in /home /var /opt /root; do
              if [ -d "$path" ]; then du -xhd1 "$path" 2>/dev/null | sort -h | tail -n 12 || true; fi
            done
            echo "=== Digibail account storage breakdown (read-only) ==="
            for path in /home/digibail /home/digibail/domains /home/digibail/domains/digebail.ir /home/digibail/.local /home/digibail/backups; do
              if [ -d "$path" ]; then echo "--- $path"; du -xhd1 "$path" 2>/dev/null | sort -h | tail -n 15 || true; fi
            done
            echo "=== Docker and containerd storage breakdown (read-only) ==="
            for path in /var/lib/docker /var/lib/containerd; do
              if [ -d "$path" ]; then echo "--- $path"; du -xhd1 "$path" 2>/dev/null | sort -h | tail -n 15 || true; fi
            done
            echo "DIGIBAIL_PRODUCTION_FINAL_VERIFICATION=PASS"
