<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدارک و قراردادها — تعریف وام</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--sf:#fff;--ink:#14213d;--mut:#5b6678;--ln:#d6dce6;--ac:#0f766e;--acs:#d9f0ec;--wn:#b45309;--wns:#fdecd3;--er:#b42318;--ers:#fde4e1;--ed:#f7f8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--sf:#172033;--ink:#e8edf6;--mut:#9aa6ba;--ln:#2a364d;--ac:#4fd1c0;--acs:#12343a;--wn:#f3b562;--wns:#3b2c12;--er:#ff8f85;--ers:#3d1c1a;--ed:#1d283e}}
:root[data-theme="dark"]{--bg:#0e1522;--sf:#172033;--ink:#e8edf6;--mut:#9aa6ba;--ln:#2a364d;--ac:#4fd1c0;--acs:#12343a;--wn:#f3b562;--wns:#3b2c12;--er:#ff8f85;--ers:#3d1c1a;--ed:#1d283e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.8 Vazirmatn,Tahoma,sans-serif;max-width:100%}
.wrap{width:100%;max-width:none;margin:0 auto;padding:clamp(10px,1.8vw,28px)}
h1{font-size:20px;margin:4px 0 2px}p.sub{margin:0 0 14px;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);margin-bottom:14px}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:500 14px Vazirmatn,Tahoma,sans-serif;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ac);border-color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:right;font-weight:500;color:var(--mut);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--ln)}td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}
select,input[type=text]{font:inherit;font-size:13px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:4px 8px}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--acs);color:var(--ac)}
.badge.dr{background:var(--wns);color:var(--wn)}.badge.er{background:var(--ers);color:var(--er)}
.btn{font:500 13px Vazirmatn,Tahoma,sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:7px;padding:5px 12px;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}[data-theme=dark] .btn.p,:root:not([data-theme=light]) .btn.p{color:#0e1522}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sw{position:relative;display:inline-block;width:38px;height:22px}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--ln);border-radius:99px;transition:.15s;pointer-events:none}.sw i:after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{right:19px}.sw input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
.ed{display:grid;grid-template-columns:1fr 230px;gap:12px}
@media(max-width:760px){.ed{grid-template-columns:1fr}}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.page{background:#fff;color:#1b1b1b;border:1px solid var(--ln);border-radius:4px;padding:28px 26px;min-height:360px;font:400 15px/2 Vazirmatn,Tahoma,serif;box-shadow:0 1px 0 var(--ln)}
.page h2{font-size:17px;text-align:center;margin:0 0 12px}.page p{margin:0 0 8px}
.chip{background:#d9f0ec;color:#0b5a53;border-radius:5px;padding:0 6px;font-size:13px;white-space:nowrap}
.chip.bad{background:#fde4e1;color:#b42318}
.cond{border-right:3px solid #b45309;background:#fdf3e4;padding:4px 10px;margin:6px 0}
.cond:before{content:"فقط اگر: " attr(data-if);font-size:11px;color:#b45309;display:block}
.sig{display:flex;justify-content:space-between;gap:12px;margin-top:26px;font-size:13px}.sig div{flex:1;border-top:1px solid #777;padding-top:4px;text-align:center}
.side h3{font-size:13px;margin:0 0 6px;color:var(--mut);font-weight:500}
.vars{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.vars button{text-align:right;background:var(--ed);border:1px solid var(--ln);border-radius:6px;padding:3px 8px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.vars small{color:var(--mut);display:block;font-size:11px;direction:ltr;text-align:right}
.msg{font-size:13px;border-radius:8px;padding:8px 10px;margin-top:8px}.msg.er{background:var(--ers);color:var(--er)}.msg.ok{background:var(--acs);color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
:root,:root[data-theme=dark]{--ac:#2f6fe4;--acs:#e1ebfd}.btn.p{color:#fff!important}
.modal{max-width:640px;margin:0 auto;background:var(--sf);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);overflow:hidden}
.mh{padding:18px 20px 4px}.mh h1{margin:0;font-size:19px}
.modal>.tabs{padding:0 12px;margin:0}.mb{padding:16px 20px 20px}
.mf{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--ln);background:var(--sf)}
.mf .btn{padding:8px 26px}
.uf{display:block;width:100%;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;margin:0 0 18px}
.uf:focus{border-color:var(--ac);outline:0}
label.lb{display:block;font-size:12px;color:var(--mut)}
.bx{border:1px solid var(--ln);border-radius:6px;width:100%;padding:10px;font:inherit;background:var(--sf);color:var(--ink);margin-bottom:16px}
.up{border:2px dashed var(--ln);background:var(--ed);height:140px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mut);margin-bottom:6px}
.tg{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.tb{border:1px solid var(--ln);border-bottom:0;border-radius:6px 6px 0 0;padding:6px 8px;display:flex;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.gr{background:var(--ed);border-radius:8px;padding:14px;margin-top:10px}
.sub2{margin:0 0 12px;border-bottom:0}
.sub2 button[aria-selected=true]{background:var(--acs);border-radius:99px;border-color:transparent}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;margin:4px 0 16px}.seg button{flex:1;border:0;background:var(--sf);color:var(--ink);padding:8px;font:inherit;cursor:pointer}.seg button[aria-pressed=true]{background:var(--ac);color:#fff}
.rte{margin-bottom:16px}.rtb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--ln);border-radius:6px 6px 0 0;background:var(--ed);align-items:center;font-size:12px;margin-top:8px}
.rtb select,.rtb input[type=text]{font-size:12px;padding:2px 4px}.rtb input[type=color]{width:28px;height:26px;padding:0;border:1px solid var(--ln);background:none}
.tbb{font:500 12px Vazirmatn,Tahoma,sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:5px;padding:2px 8px;cursor:pointer;min-height:26px;display:inline-flex;align-items:center}
.tbg{display:inline-flex;gap:3px;align-items:center;padding:0 4px;border-right:1px solid var(--ln)}
.rbody,#pg{outline:0}.rbody{min-height:220px;border:1px solid var(--ln);border-top:0;padding:12px;background:#fff;color:#1b1b1b;line-height:2}
.rbody table,#pg table{border-collapse:collapse;width:100%}.rbody td,#pg td{border:1px solid #999;padding:6px}.rbody img{max-width:100%}
.rtf{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);border:1px solid var(--ln);border-top:0;border-radius:0 0 6px 6px;padding:4px 8px}
.fsx{position:fixed!important;inset:0;z-index:50;background:var(--sf);overflow:auto;padding:12px;margin:0!important}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);overflow:auto;padding:16px}.ov[hidden]{display:none}.ov .modal{overflow:visible}
#ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:8px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}

/* Responsive production workspace refresh */
html,body{width:100%;min-width:0;overflow-x:hidden}
.wrap{min-height:100dvh}
#lp{width:100%;max-width:none}
#lp .card{width:100%;min-width:0}
#lp .tw{width:100%;max-width:100%;overflow-x:auto;border-radius:14px}
#lp table{width:100%;min-width:820px;border-collapse:separate;border-spacing:0}
#lp th{font-weight:700;background:var(--ed);white-space:nowrap}
#lp td,#lp th{padding:13px 12px;vertical-align:middle}
#lp tbody tr{transition:background .16s}
#lp tbody tr:hover{background:color-mix(in srgb,var(--ac) 5%,var(--sf))}
#lp .loan-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;white-space:normal;min-width:190px}
#lp .action-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 11px;border:1px solid var(--ln);border-radius:11px;background:var(--sf);color:var(--ink);font:600 12px/1.3 Vazirmatn,Tahoma,sans-serif;cursor:pointer;box-shadow:0 1px 2px #1018280a;transition:transform .16s,border-color .16s,background .16s}
#lp .action-btn:hover{transform:translateY(-1px);border-color:var(--ac);background:var(--acs)}
#lp .action-btn:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 35%,transparent);outline-offset:2px}
#lp .action-btn .action-icon{display:inline-grid;place-items:center;width:19px;height:19px;font-size:15px;line-height:1}
#lp .action-btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
#lp .action-btn.danger{color:var(--er);border-color:color-mix(in srgb,var(--er) 35%,var(--ln))}
#lp .action-btn:disabled{opacity:.55;cursor:wait;transform:none}
#lp .badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px}
#loanCampaignStudio{width:100%;border-radius:18px;padding:clamp(14px,2vw,24px)}
#loanCampaignStudio .row{display:flex;flex-wrap:wrap;gap:12px}
#loanCampaignStudio .row>*{min-width:min(100%,220px)}
#loanCampaignStudio input,#loanCampaignStudio select,#loanCampaignStudio textarea{max-width:100%;min-width:0}
#csPreview{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
#csPreview>div{min-width:0;border:1px solid var(--ln);border-radius:14px;padding:10px;background:var(--sf)}
@media(max-width:760px){
 .wrap{padding:10px}
 #lp .tw{overflow:visible}
 #lp table{min-width:0;display:block}
 #lp thead{display:none}
 #lp tbody,#lp tbody tr{display:block;width:100%}
 #lp tbody tr{margin:0 0 14px;padding:8px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);box-shadow:0 4px 18px #10182808}
 #lp tbody td{display:grid;grid-template-columns:minmax(82px,30%) minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:10px 8px;border-bottom:1px solid var(--ln);overflow-wrap:anywhere}
 #lp tbody td:last-child{border-bottom:0}
 #lp tbody td:before{content:attr(data-label);font-size:11px;color:var(--mut);font-weight:700}
 #lp tbody td:first-child{display:block;padding-top:12px}
 #lp tbody td:first-child:before{content:""}
 #lp .loan-actions{min-width:0;gap:6px}
 #lp .action-btn{flex:1 1 calc(50% - 6px);min-height:42px;padding:8px 9px;font-size:12px}
 #lp tbody td[colspan]{display:block;text-align:center}
 #lp tbody td[colspan]:before{content:none}
 #lpager{align-items:stretch!important}
 #lpager>div{width:100%}
 #lpager .btn{flex:1;min-height:42px}
 #loanCampaignStudio .row{display:grid;grid-template-columns:1fr}
 #loanCampaignStudio .row>*{min-width:0;width:100%}
 #csPreview{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:390px){#lp .action-btn{flex-basis:100%}#csPreview{grid-template-columns:1fr}}


/* Refined loan workspace: cards, hierarchy, and mobile-first controls */
#lp{--loan-accent:#315fe8;--loan-accent-soft:#edf2ff;--loan-border:#e4e9f2;--loan-muted:#68758c;color:var(--ink)}
#lp>h1{font-size:clamp(25px,2.6vw,34px)!important;letter-spacing:-.7px;margin:4px 0 3px!important}
#lp>h1:before{content:"";display:inline-block;width:7px;height:29px;border-radius:9px;background:linear-gradient(180deg,#4779ff,#20b6a7);margin-left:12px;vertical-align:-5px}
#lp>.sub{font-size:13px;line-height:1.9}
#lp>.row{background:var(--sf);border:1px solid var(--loan-border)!important;border-radius:18px;padding:14px!important;box-shadow:0 8px 24px rgba(25,45,85,.045);gap:9px!important}
#lp .bx{border-radius:12px;min-height:44px;padding:9px 12px;border-color:var(--loan-border);transition:border-color .15s,box-shadow .15s}
#lp .bx:focus{border-color:var(--loan-accent);box-shadow:0 0 0 3px rgba(49,95,232,.11);outline:0}
#lp .btn{min-height:42px;border-radius:12px;padding:9px 14px;font-weight:700;transition:transform .15s,box-shadow .15s}
#lp .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px rgba(30,50,90,.10)}
#lp .btn.p{background:linear-gradient(135deg,#315fe8,#4a78f2);border-color:transparent;box-shadow:0 5px 13px rgba(49,95,232,.18)}
.loan-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 12px}
.loan-stat{display:flex;align-items:center;gap:12px;min-width:0;background:var(--sf);border:1px solid var(--loan-border);border-radius:17px;padding:16px;box-shadow:0 6px 20px rgba(25,45,85,.035)}
.loan-stat-icon{display:grid;place-items:center;flex:0 0 43px;height:43px;border-radius:14px;background:#edf2ff;color:#315fe8;font-size:21px;font-weight:800}
.loan-stat.green .loan-stat-icon{background:#e5f8ef;color:#13885d}.loan-stat.amber .loan-stat-icon{background:#fff3d9;color:#b77912}.loan-stat.violet .loan-stat-icon{background:#f0eaff;color:#7550c9}
.loan-stat small{display:block;color:var(--loan-muted);font-size:12px;font-weight:600;white-space:nowrap}
.loan-stat strong{display:block;font-size:25px;line-height:1.5;font-weight:800;letter-spacing:-.5px}
.loan-statusline{display:block;margin:10px 2px 12px!important;padding:9px 12px;border-radius:11px;background:var(--ed);border:1px solid var(--loan-border)}
.loan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;align-items:stretch}
.loan-card{position:relative;display:flex;flex-direction:column;min-width:0;padding:18px;background:var(--sf);border:1px solid var(--loan-border);border-radius:20px;box-shadow:0 7px 24px rgba(25,45,85,.045);transition:transform .18s,border-color .18s,box-shadow .18s;overflow:hidden}
.loan-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#315fe8,#35b8a7);opacity:.8}
.loan-card:hover{transform:translateY(-2px);border-color:#c8d5f5;box-shadow:0 14px 30px rgba(25,45,85,.09)}
.loan-card.needs-review{border-color:#f2d5a0}.loan-card.needs-review:before{background:linear-gradient(90deg,#d98a17,#f3c35f)}
.loan-card-top{display:flex;align-items:flex-start;gap:12px;min-width:0}
.loan-card-icon{display:grid;place-items:center;flex:0 0 48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#edf2ff,#e5edff);color:#315fe8;font-size:24px;font-weight:800}
.loan-card-title{flex:1;min-width:0}
.loan-card-title h2{font-size:17px;line-height:1.7;font-weight:800;margin:0 0 6px;overflow-wrap:anywhere}
.loan-card-meta{display:flex;flex-wrap:wrap;gap:6px}
.loan-status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;background:#f0f2f6;color:#68758c}
.loan-status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.loan-status.is-active{background:#e5f8ef;color:#13885d}.loan-status.is-inactive{background:#f0f2f6;color:#68758c}.loan-status.is-review{background:#fff3d9;color:#a96c0a}.loan-status.is-listed{background:#edf2ff;color:#315fe8}.loan-status.is-hidden{background:#f3f4f6;color:#667085}
.loan-more{display:grid;place-items:center;flex:0 0 38px;height:38px;border:1px solid var(--loan-border);border-radius:12px;background:var(--sf);color:var(--loan-muted);font-size:18px;cursor:pointer}
.loan-more:hover{background:var(--loan-accent-soft);color:var(--loan-accent);border-color:#c8d5f5}
.loan-card-highlight{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0 14px;padding:13px 14px;border:1px solid #e8edfa;border-radius:14px;background:linear-gradient(110deg,#f8faff,#f4f7ff)}
.loan-card-highlight>div{min-width:0}.loan-card-highlight>div+div{border-right:1px solid #e0e7f7;padding-right:12px}
.loan-card-highlight span,.loan-card-metrics small{display:block;color:var(--loan-muted);font-size:11px;font-weight:600;margin-bottom:4px}
.loan-card-highlight strong{display:block;font-size:13px;font-weight:800;overflow-wrap:anywhere}
.loan-card-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.loan-card-metrics>div{display:flex;align-items:center;gap:7px;min-width:0;padding:8px 5px;border-radius:11px;background:var(--ed)}
.metric-icon{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:9px;background:var(--sf);color:#315fe8;font-size:14px}
.loan-card-metrics strong{display:block;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.loan-card-metrics small{font-size:10px;margin:0;white-space:nowrap}
.loan-source{font-size:11px;color:var(--loan-muted);padding:5px 0 10px}
.loan-card-footer{margin-top:auto;border-top:1px solid var(--loan-border);padding-top:13px}
.loan-list-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;cursor:pointer}
.loan-list-toggle strong,.loan-list-toggle small{display:block}.loan-list-toggle strong{font-size:12px}.loan-list-toggle small{font-size:10px;color:var(--loan-muted)}
.loan-card .loan-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;min-width:0}
.loan-card .action-btn{width:100%;min-width:0;min-height:41px;border-radius:11px;padding:8px 9px;white-space:nowrap;font-size:12px}
.loan-card .action-btn.primary{background:linear-gradient(135deg,#315fe8,#4a78f2);border-color:transparent;color:white}
.loan-card .action-btn[data-campaign]{grid-column:span 2}
.loan-card .action-btn.danger{background:#fff7f6}
.loan-empty{grid-column:1/-1;text-align:center;padding:42px 20px;border:1px dashed var(--loan-border);border-radius:20px;background:var(--sf)}
.loan-empty-icon{display:grid;place-items:center;margin:0 auto 12px;width:58px;height:58px;border-radius:18px;background:var(--loan-accent-soft);color:var(--loan-accent);font-size:30px}
.loan-empty h3{font-size:17px;margin:0 0 5px}.loan-empty p{font-size:13px;color:var(--loan-muted);margin:0 0 15px}
#lpager{border:1px solid var(--loan-border);background:var(--sf);border-radius:14px;padding:12px 14px!important}
#loanCampaignStudio{box-shadow:0 10px 28px rgba(25,45,85,.06);border-color:#d6e0fa!important}
#loanCampaignStudio h2{font-size:20px!important}
@media(max-width:900px){.loan-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.loan-grid{grid-template-columns:1fr}}
@media(max-width:540px){
 #lp>h1{font-size:25px!important}
 #lp>.row{padding:10px!important}
 #lp .bx{width:100%!important;min-width:0!important}
 #lp>.row>input,#lp>.row>select,#lp>.row>button{flex:1 1 100%!important}
 .loan-stats{gap:8px;margin-top:12px}
 .loan-stat{padding:11px;gap:9px;border-radius:14px}
 .loan-stat-icon{flex-basis:35px;height:35px;border-radius:11px;font-size:17px}
 .loan-stat small{font-size:10px;white-space:normal}.loan-stat strong{font-size:21px}
 .loan-card{padding:14px;border-radius:17px}
 .loan-card-title h2{font-size:15px}
 .loan-card-highlight{padding:10px}
 .loan-card-metrics{gap:5px}
 .loan-card-metrics>div{display:block;text-align:center;padding:8px 3px}
