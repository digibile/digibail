<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدارک و قراردادها — تعریف وام</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--sf:#fff;--ink:#14213d;--mut:#5b6678;--ln:#d6dce6;--ac:#0f766e;--acs:#d9f0ec;--wn:#b45309;--wns:#fdecd3;--er:#b42318;--ers:#fde4e1;--ed:#f7f8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--sf:#172033;--ink:#e8edf6;--mut:#9aa6ba;--ln:#2a364d;--ac:#4fd1c0;--acs:#12343a;--wn:#f3b562;--wns:#3b2c12;--er:#ff8f85;--ers:#3d1c1a;--ed:#1d283e}}
:root[data-theme="dark"]{--bg:#0e1522;--sf:#172033;--ink:#e8edf6;--mut:#9aa6ba;--ln:#2a364d;--ac:#4fd1c0;--acs:#12343a;--wn:#f3b562;--wns:#3b2c12;--er:#ff8f85;--ers:#3d1c1a;--ed:#1d283e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.8 Vazirmatn,Tahoma,sans-serif;max-width:100%}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}p.sub{margin:0 0 14px;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);margin-bottom:14px}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:500 14px Vazirmatn,Tahoma,sans-serif;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ac);border-color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:right;font-weight:500;color:var(--mut);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--ln)}td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}
select,input[type=text]{font:inherit;font-size:13px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:4px 8px}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--acs);color:var(--ac)}
.badge.dr{background:var(--wns);color:var(--wn)}.badge.er{background:var(--ers);color:var(--er)}
.btn{font:500 13px Vazirmatn,Tahoma,sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:7px;padding:5px 12px;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}[data-theme=dark] .btn.p,:root:not([data-theme=light]) .btn.p{color:#0e1522}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sw{position:relative;display:inline-block;width:38px;height:22px}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--ln);border-radius:99px;transition:.15s;pointer-events:none}.sw i:after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{right:19px}.sw input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
.ed{display:grid;grid-template-columns:1fr 230px;gap:12px}
@media(max-width:760px){.ed{grid-template-columns:1fr}}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.page{background:#fff;color:#1b1b1b;border:1px solid var(--ln);border-radius:4px;padding:28px 26px;min-height:360px;font:400 15px/2 Vazirmatn,Tahoma,serif;box-shadow:0 1px 0 var(--ln)}
.page h2{font-size:17px;text-align:center;margin:0 0 12px}.page p{margin:0 0 8px}
.chip{background:#d9f0ec;color:#0b5a53;border-radius:5px;padding:0 6px;font-size:13px;white-space:nowrap}
.chip.bad{background:#fde4e1;color:#b42318}
.cond{border-right:3px solid #b45309;background:#fdf3e4;padding:4px 10px;margin:6px 0}
.cond:before{content:"فقط اگر: " attr(data-if);font-size:11px;color:#b45309;display:block}
.sig{display:flex;justify-content:space-between;gap:12px;margin-top:26px;font-size:13px}.sig div{flex:1;border-top:1px solid #777;padding-top:4px;text-align:center}
.side h3{font-size:13px;margin:0 0 6px;color:var(--mut);font-weight:500}
.vars{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.vars button{text-align:right;background:var(--ed);border:1px solid var(--ln);border-radius:6px;padding:3px 8px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.vars small{color:var(--mut);display:block;font-size:11px;direction:ltr;text-align:right}
.msg{font-size:13px;border-radius:8px;padding:8px 10px;margin-top:8px}.msg.er{background:var(--ers);color:var(--er)}.msg.ok{background:var(--acs);color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
:root,:root[data-theme=dark]{--ac:#2f6fe4;--acs:#e1ebfd}.btn.p{color:#fff!important}
.modal{max-width:640px;margin:0 auto;background:var(--sf);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);overflow:hidden}
.mh{padding:18px 20px 4px}.mh h1{margin:0;font-size:19px}
.modal>.tabs{padding:0 12px;margin:0}.mb{padding:16px 20px 20px}
.mf{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--ln);background:var(--sf)}
.mf .btn{padding:8px 26px}
.uf{display:block;width:100%;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;margin:0 0 18px}
.uf:focus{border-color:var(--ac);outline:0}
label.lb{display:block;font-size:12px;color:var(--mut)}
.bx{border:1px solid var(--ln);border-radius:6px;width:100%;padding:10px;font:inherit;background:var(--sf);color:var(--ink);margin-bottom:16px}
.up{border:2px dashed var(--ln);background:var(--ed);height:140px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mut);margin-bottom:6px}
.tg{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.tb{border:1px solid var(--ln);border-bottom:0;border-radius:6px 6px 0 0;padding:6px 8px;display:flex;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.gr{background:var(--ed);border-radius:8px;padding:14px;margin-top:10px}
.sub2{margin:0 0 12px;border-bottom:0}
.sub2 button[aria-selected=true]{background:var(--acs);border-radius:99px;border-color:transparent}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;margin:4px 0 16px}.seg button{flex:1;border:0;background:var(--sf);color:var(--ink);padding:8px;font:inherit;cursor:pointer}.seg button[aria-pressed=true]{background:var(--ac);color:#fff}
.rte{margin-bottom:16px}.rtb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--ln);border-radius:6px 6px 0 0;background:var(--ed);align-items:center;font-size:12px;margin-top:8px}
.rtb select,.rtb input[type=text]{font-size:12px;padding:2px 4px}.rtb input[type=color]{width:28px;height:26px;padding:0;border:1px solid var(--ln);background:none}
.tbb{font:500 12px Vazirmatn,Tahoma,sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:5px;padding:2px 8px;cursor:pointer;min-height:26px;display:inline-flex;align-items:center}
.tbg{display:inline-flex;gap:3px;align-items:center;padding:0 4px;border-right:1px solid var(--ln)}
.rbody,#pg{outline:0}.rbody{min-height:220px;border:1px solid var(--ln);border-top:0;padding:12px;background:#fff;color:#1b1b1b;line-height:2}
.rbody table,#pg table{border-collapse:collapse;width:100%}.rbody td,#pg td{border:1px solid #999;padding:6px}.rbody img{max-width:100%}
.rtf{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);border:1px solid var(--ln);border-top:0;border-radius:0 0 6px 6px;padding:4px 8px}
.fsx{position:fixed!important;inset:0;z-index:50;background:var(--sf);overflow:auto;padding:12px;margin:0!important}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);overflow:auto;padding:16px}.ov[hidden]{display:none}.ov .modal{overflow:visible}
#ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:8px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
</style>
</head>
<body>
<div class="wrap"><div class="modal">
<div class="mh"><h1>اطلاعات وام</h1></div>
<div class="tabs" role="tablist" id="mt"></div>
<div class="mb"><div id="mv"></div><div id="cw"><div class="tabs sub2" role="tablist" id="tabs"></div><div id="view"></div></div></div>
<div class="mf"><button class="btn p" id="save">ذخیره</button><button class="btn">بستن</button></div>
</div></div>
<script>
var fa=function(n){return Number(n).toLocaleString('fa-IR')};
var docs=[["کارت ملی",1,"ثبت درخواست"],["شناسنامه",0,"ثبت درخواست"],["فیش حقوقی",1,"پس از اعتبارسنجی"],["گردش حساب ۶ ماهه",1,"پس از اعتبارسنجی"],["مدارک ضامن",0,"قبل از قرارداد"]];
var stages=["ثبت درخواست","پس از اعتبارسنجی","قبل از قرارداد","پس از تأیید نهایی"];
var tpls=[["قرارداد وام شرکت","شرکت ما","v۳","منتشرشده","پس از تأیید نهایی",1],["قرارداد بانک تأمین‌کننده","بانک ملی","v۱","منتشرشده","پس از تأیید نهایی",1],["تعهدنامه و ضمانت","شرکت ما","v۲","پیش‌نویس","قبل از قرارداد",0]];
var V=[["applicant.full_name","نام و نام خانوادگی متقاضی","سارا احمدی",1],["applicant.national_id","کد ملی (حساس)","۰۰۱۲****۳۴",1],["loan.amount","مبلغ وام","۱۲۰٬۰۰۰٬۰۰۰ تومان",1],["loan.installments","تعداد اقساط","۱۲",1],["loan.installment_amount","مبلغ هر قسط","۱۱٬۵۰۰٬۰۰۰ تومان",1],["loan.start_date","تاریخ شروع بازپرداخت","۱۴۰۵/۰۹/۰۱",1],["party.bank_name","نام بانک","بانک ملی",1],["guarantor.full_name","نام ضامن","",0],["contract.number","شماره قرارداد","VC-1405-0042",1]];
var rules=[["has_guarantor","درج بند","بند ضامن"],["plan.requires_collateral","درج بند","بند وثیقه"]];
var tab=0,tabNames=["مدارک موردنیاز","قراردادها","ادیتور قرارداد","قواعد اجرا"],hasG=false,prev=false,saved="";
var $=function(i){return document.getElementById(i)};
function opts(a,s){return a.map(function(x){return '<option'+(x==s?' selected':'')+'>'+x+'</option>'}).join('')}
function tabs(){$('tabs').innerHTML=tabNames.map(function(n,i){return '<button role="tab" aria-selected="'+(i==tab)+'" data-t="'+i+'">'+n+'</button>'}).join('');
[].forEach.call($('tabs').children,function(b){b.onclick=function(){tab=+b.dataset.t;render()}})}
function render(){tabs();var v=$('view');if(tab==0)v.innerHTML=T0();else if(tab==1)v.innerHTML=T1();else if(tab==2){v.innerHTML=T2();ed()}else{v.innerHTML=T3();rl()}}
function T0(){return '<div class="card"><div class="tw"><table><tr><th>مدرک</th><th>اجباری</th><th>مرحله دریافت</th></tr>'+docs.map(function(d,i){return '<tr><td>'+d[0]+'</td><td><label class="sw"><input type="checkbox" data-d="'+i+'"'+(d[1]?' checked':'')+' aria-label="اجباری"><i></i></label></td><td><select data-s="'+i+'" aria-label="مرحله">'+opts(stages,d[2])+'</select></td></tr>'}).join('')+'</table></div><p class="sub" style="margin:10px 0 0">مدرک اجباری ناقص، مرحله بعد را متوقف می‌کند.</p></div>'}
function T1(){return '<div class="card"><div class="tw"><table><tr><th>قالب</th><th>مالک</th><th>نسخه</th><th>وضعیت</th><th>مرحله تولید</th><th>اجباری</th><th></th></tr>'+tpls.map(function(t,i){return '<tr><td>'+t[0]+'</td><td>'+t[1]+'</td><td>'+t[2]+'</td><td><span class="badge'+(t[3]=="منتشرشده"?'':' dr')+'">'+t[3]+'</span></td><td>'+t[4]+'</td><td>'+(t[5]?'بله':'خیر')+'</td><td><button class="btn" data-e="'+i+'">ویرایش در ادیتور</button></td></tr>'}).join('')+'</table></div><p style="margin:10px 0 0"><button class="btn p" id="nt">قالب جدید</button></p></div>'}
function T2(){return '<div class="card"><div class="bar"><button class="btn" data-c="bold">پررنگ</button><button class="btn" data-c="h">عنوان</button><button class="btn" data-c="insertUnorderedList">فهرست</button><button class="btn" id="cd">بند شرطی ضامن</button><button class="btn" id="sg">محل امضا</button><span style="flex:1"></span><button class="btn" id="pv">'+(prev?'بازگشت به ویرایش':'پیش‌نمایش')+'</button></div><div class="ed"><div><div id="pg" class="page" '+(prev?'':'contenteditable="true"')+' aria-label="متن قرارداد"></div><div id="ms"></div><p style="margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sv">ذخیره پیش‌نویس</button><button class="btn p" id="pb">انتشار نسخه</button>'+(prev?'<label style="font-size:13px"><input type="checkbox" id="hg"'+(hasG?' checked':'')+'> متقاضی ضامن دارد</label>':'')+'</p></div><div class="side"><h3>متغیرها — برای درج کلیک کنید</h3><div class="vars">'+V.map(function(x){return '<button data-v="'+x[0]+'">'+x[1]+(x[3]?'':' (اجباری)')+'<small>'+x[0]+'</small></button>'}).join('')+'</div></div></div></div>'}
function T3(){return '<div class="card"><div id="rl"></div><p style="margin:10px 0 0"><button class="btn" id="ar">افزودن قاعده</button></p><p class="sub" style="margin:10px 0 0">قواعد فقط از شرط‌ها و عمل‌های ثبت‌شده ساخته می‌شوند؛ کد دلخواه اجرا نمی‌شود.</p></div>'}
function rl(){var conds=["has_guarantor","plan.requires_collateral","provider = بانک"],acts=["درج بند","حذف بند","انتخاب قالب","الزام تأیید کارشناس"],cl=["بند ضامن","بند وثیقه","جدول اقساط","قالب بانک"];
$('rl').innerHTML=rules.map(function(r,i){return '<div class="row">اگر <select data-r="'+i+'0">'+opts(conds,r[0])+'</select> آنگاه <select data-r="'+i+'1">'+opts(acts,r[1])+'</select><select data-r="'+i+'2">'+opts(cl,r[2])+'</select><button class="btn" data-x="'+i+'">حذف</button></div>'}).join('');
$('ar').onclick=function(){rules.push(["has_guarantor","درج بند","بند ضامن"]);rl()};
[].forEach.call(document.querySelectorAll('[data-r]'),function(s){s.onchange=function(){rules[+s.dataset.r[0]][+s.dataset.r[1]]=s.value}});
[].forEach.call(document.querySelectorAll('[data-x]'),function(b){b.onclick=function(){rules.splice(+b.dataset.x,1);rl()}})}
var base='<h2>قرارداد وام شرکت</h2><p>شماره قرارداد: <span class="chip" contenteditable="false" data-var="contract.number">شماره قرارداد</span></p><p>این قرارداد بین شرکت و <span class="chip" contenteditable="false" data-var="applicant.full_name">نام و نام خانوادگی متقاضی</span> به کد ملی <span class="chip" contenteditable="false" data-var="applicant.national_id">کد ملی (حساس)</span> منعقد می‌شود.</p><p>مبلغ وام <span class="chip" contenteditable="false" data-var="loan.amount">مبلغ وام</span> در <span class="chip" contenteditable="false" data-var="loan.installments">تعداد اقساط</span> قسط <span class="chip" contenteditable="false" data-var="loan.installment_amount">مبلغ هر قسط</span> بازپرداخت می‌شود.</p><div class="cond" data-if="has_guarantor" contenteditable="true">ضامن: <span class="chip" contenteditable="false" data-var="guarantor.full_name">نام ضامن</span> مسئولیت بازپرداخت را می‌پذیرد.</div><div class="sig"><div>امضای متقاضی</div><div>مهر و امضای شرکت</div></div>';
function chipHTML(k){var x=V.filter(function(a){return a[0]==k})[0];return '<span class="chip" contenteditable="false" data-var="'+k+'">'+(x?x[1]:k)+'</span>&nbsp;'}
function check(){var el=$('pg'),m=$('ms'),tmp=document.createElement('div');tmp.innerHTML=saved||el.innerHTML;var used={},unk=[],miss=[];
[].forEach.call(tmp.querySelectorAll('[data-var]'),function(c){var k=c.dataset.var,x=V.filter(function(a){return a[0]==k})[0];if(!x){if(unk.indexOf(k)<0)unk.push(k)}else{var inCond=c.closest('.cond');if(!(inCond&&!hasG)&&!x[2]&&x[3]&&miss.indexOf(x[1])<0)miss.push(x[1]);used[k]=1}});
return{unk:unk,miss:miss}}
function ed(){var pg=$('pg');if(prev){var t=document.createElement('div');t.innerHTML=saved;
[].forEach.call(t.querySelectorAll('.cond'),function(c){if(!hasG)c.remove();else c.removeAttribute('contenteditable')});
[].forEach.call(t.querySelectorAll('[data-var]'),function(c){var x=V.filter(function(a){return a[0]==c.dataset.var})[0];if(x&&x[2])c.textContent=x[2];else{c.classList.add('bad');c.textContent='⚠ '+(x?x[1]:'ناشناخته')}});pg.innerHTML=t.innerHTML;
var r=check();$('ms').innerHTML=r.miss.length?'<div class="msg er">تولید نهایی متوقف می‌شود. اطلاعات ناقص: '+r.miss.join('، ')+'</div>':'<div class="msg ok">همه متغیرهای اجباری مقدار معتبر دارند.</div>';$('hg').onchange=function(){hasG=this.checked;ed()}}
else{pg.innerHTML=saved||base;$('ms').innerHTML=''}
$('pv').onclick=function(){if(!prev)saved=pg.innerHTML;prev=!prev;render()};
if(prev)$('sv').disabled=$('pb').disabled=true;
[].forEach.call(document.querySelectorAll('[data-v]'),function(b){b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){if(prev)return;pg.focus();document.execCommand('insertHTML',false,chipHTML(b.dataset.v))}});
[].forEach.call(document.querySelectorAll('[data-c]'),function(b){b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){if(prev)return;b.dataset.c=='h'?document.execCommand('formatBlock',false,'h2'):document.execCommand(b.dataset.c)}});
$('cd').onclick=function(){if(prev)return;pg.focus();document.execCommand('insertHTML',false,'<div class="cond" data-if="has_guarantor">متن بند شرطی…</div><p></p>')};
$('sg').onclick=function(){if(prev)return;pg.focus();document.execCommand('insertHTML',false,'<div class="sig"><div>امضا</div><div>مهر</div></div><p></p>')};
$('sv').onclick=function(){saved=pg.innerHTML;$('ms').innerHTML='<div class="msg ok">پیش‌نویس ذخیره شد.</div>'};
$('pb').onclick=function(){saved=pg.innerHTML;var r=check();$('ms').innerHTML=r.unk.length?'<div class="msg er">انتشار انجام نشد. متغیر ناشناخته: '+r.unk.join('، ')+'</div>':'<div class="msg ok">نسخه جدید منتشر شد و دیگر قابل ویرایش نیست. قراردادهای قبلی تغییر نمی‌کنند.</div>'}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-e]');if(b){tab=2;render()}if(e.target.id=='nt'){tpls.push(["قالب جدید","شرکت ما","v۱","پیش‌نویس","قبل از قرارداد",0]);render()}});
