services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deployment .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deployment .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in deployment .env}
    volumes:
      - digibail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deployment .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-digibail_vamcitydigibilepay}
      MARIADB_USER: ${MARIADB_USER:-digibail_vamcitydigibilepay}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      MARIADB_SOCKET: /var/run/mysqld/mysqld.sock
      PORT: 1631
      HOST: 0.0.0.0
    volumes:
      - /var/lib/mysql/mysql.sock:/var/run/mysqld/mysqld.sock
    ports:
      - "1631:1631"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1631/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]
volumes:
  digibail_pgdata:
networks:
  private:
    driver: bridge
