services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-digibail_vamcitydigibilepay}
      MARIADB_USER: ${MARIADB_USER:?Set MARIADB_USER in deployment .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in deployment .env}
      MARIADB_SOCKET: /tmp/mysql.sock
      PORT: 1631
      HOST: 0.0.0.0
    group_add:
      - "${MARIADB_SOCKET_GID:?MariaDB socket group id is required}"
    volumes:
      - /var/lib/mysql/mysql.sock:/tmp/mysql.sock
    ports:
      - "1631:1631"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1631/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
